<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Vanguardia - Proveedores</title>
    <link rel="icon" href="img/logo_x16.jpg">
    <!-- ESTILOS DEL MENU -->
    <link href="menu/styles.css" rel="stylesheet"/>
    <!-- BOOTSTRAP -->
    <link rel="stylesheet" href="bt/bootstrap.min.css">
    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="bt-icons/bootstrap-icons.min.css">
    <!-- ALERTIFY -->
    <link rel="stylesheet" href="alert/alertify.min.css">
    <link rel="stylesheet" href="alert/themes/default.min.css">
    <!-- DATATABLES -->
    <link rel="stylesheet" href="dt/datatables.min.css">
    <link rel="stylesheet" href="dt/jquery.dataTables.min.css">
    <link rel="stylesheet" href="dt/buttons.dataTables.min.css">
    <!-- TEMA VANGUARDIA -->
    <link rel="stylesheet" href="css/vanguardia.css">
</head>
<body class="sb-nav-fixed">
    <div id="contenedor-navbar">
        
        <!-- 1. CONTENEDOR DINÁMICO PARA LA BARRA SUPERIOR (NAVBAR)    -->
        
    </div>
    <div id="layoutSidenav">
        <div id="contenedor-sidebar">
            <!-- 2. CONTENEDOR DINÁMICO PARA EL MENÚ LATERAL (SIDEBAR)     -->
           
        </div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <div class="d-flex justify-content-between align-items-center mt-2 mb-2">
                        <h1 class="mb-0">Proveedores</h1>
                        <button class="btn btn-sm btn-primary" id="btnModalNuevo" type="button" onclick="ventanaNuevoProveedor()">
                            <i class="bi bi-truck me-1"></i> Nuevo Proveedor
                        </button>
                    </div>
                    <!-- Filtro de estado -->
                    <div class="row mb-3">
                        <div class="col-12">
                            <div class="card" style="background:rgba(255,255,255,0.65);border:1px solid rgba(100,160,255,0.3);box-shadow:0 8px 32px rgba(30,80,180,0.12);border-radius:12px;backdrop-filter:blur(6px);">
                                <div class="card-header py-2 px-3" style="background:rgba(30,80,180,0.9);color:white;border-radius:11px 11px 0 0;">
                                    <i class="bi bi-funnel-fill me-1"></i><strong>Filtros</strong>
                                </div>
                                <div class="card-body py-3">
                                    <div class="row g-3 align-items-end">
                                        <div class="col-md-3 col-sm-6">
                                            <label for="filtro_estado_proveedor" class="form-label fw-semibold small mb-1" style="color:#0d2149">Estado</label>
                                            <select id="filtro_estado_proveedor" class="form-select form-select-sm" onchange="cargarDatos()" style="background-color:rgba(255,255,255,0.9);border:1px solid rgba(30,80,180,0.3);color:#0d2149;border-radius:6px;">
                                                <option value="ACTIVO">Solo Activos</option>
                                                <option value="INACTIVO">Solo Inactivos</option>
                                                <option value="">Todos</option>
                                            </select>
                                        </div>
                                        <div class="col-md-3 col-sm-6">
                                            <label for="filtro_ciudad_proveedor" class="form-label fw-semibold small mb-1" style="color:#0d2149">Ciudad</label>
                                            <select id="filtro_ciudad_proveedor" class="form-select form-select-sm" onchange="cargarDatos()" style="background-color:rgba(255,255,255,0.9);border:1px solid rgba(30,80,180,0.3);color:#0d2149;border-radius:6px;">
                                                <option value="">Todas</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <table id="tabla_proveedores" class="display compact" style="width:100%">
                        </table>
                    </div>
                </div>
            </main>
            <footer class="py-4 bg-light mt-auto" id="contenedor-footer">
                <!-- 3. CONTENEDOR DINÁMICO PARA EL PIE DE PAGINA (FOOTER)     -->

            </footer>
        </div>
    </div>

    <!-- Modal Nuevo Proveedor -->
    <div class="modal fade" id="modalNuevoProveedor" tabindex="-1" aria-labelledby="modalNuevoProveedorLabel" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-lg">
            <form class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalNuevoProveedorLabel"><i class="bi bi-truck"></i> Agregar Nuevo Proveedor</h5>
                </div>
                <div class="modal-body">
                    <div class="mb-2">
                        <label class="form-label">Razón Social <span class="text-danger">*</span></label>
                        <input class="form-control" id="new_legal_name" type="text" minlength="5" maxlength="30" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">RUC / Cédula <span class="text-danger">*</span></label>
                        <input class="form-control" id="new_ruc" type="text" placeholder="Ej: 1234567 o 80012345-1" minlength="6" maxlength="15" pattern="^(\d+-\d|\d+)$" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Teléfono <span class="text-danger">*</span></label>
                        <input class="form-control" id="new_tel" type="text" placeholder="Ej: 0985123456" minlength="10" maxlength="15" pattern="^\d{10,15}$" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Correo Electrónico <span class="text-danger">*</span></label>
                        <input class="form-control" id="new_email" type="email" placeholder="proveedor@dominio.com" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Dirección <span class="text-danger">*</span></label>
                        <input class="form-control text-uppercase" id="new_address" type="text" minlength="5" maxlength="50" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Ciudad <span class="text-danger">*</span></label>
                        <input class="form-control text-uppercase" id="new_city" type="text" minlength="5" maxlength="50" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="reset" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cancelar</button>
                    <button class="btn btn-primary" type="button" onclick="btnNuevoProveedor()"><i class="bi bi-floppy"></i> Guardar Proveedor</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Editar Proveedor -->
    <div class="modal fade" id="modalEditarProveedor" tabindex="-1" aria-labelledby="modalEditarProveedorLabel" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-lg">
            <form class="modal-content">
                <div class="modal-header bg-warning text-dark">
                    <h5 class="modal-title" id="modalEditarProveedorLabel"><i class="bi bi-pencil-square"></i> Editar Proveedor</h5>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="edit_id">
                    <div class="mb-2">
                        <label class="form-label">Razón Social <span class="text-danger">*</span></label>
                        <input class="form-control" id="edit_legal_name" type="text" minlength="5" maxlength="30" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">RUC / Cédula <span class="text-danger">*</span></label>
                        <input class="form-control" id="edit_ruc" type="text" minlength="6" maxlength="15" pattern="^(\d+-\d|\d+)$" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Teléfono <span class="text-danger">*</span></label>
                        <input class="form-control" id="edit_tel" type="text" minlength="5" maxlength="15" pattern="^\d{5,15}$" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Correo Electrónico <span class="text-danger">*</span></label>
                        <input class="form-control" id="edit_email" type="email" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Dirección <span class="text-danger">*</span></label>
                        <input class="form-control text-uppercase" id="edit_address" type="text" minlength="5" maxlength="50" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Ciudad <span class="text-danger">*</span></label>
                        <input class="form-control text-uppercase" id="edit_city" type="text" minlength="5" maxlength="50" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="reset" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cancelar</button>
                    <button class="btn btn-warning" type="button" onclick="btnEditarProveedor()"><i class="bi bi-floppy"></i> Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Desactivar Proveedor -->
    <div class="modal fade" id="modalEliminarProveedor" tabindex="-1" aria-labelledby="modalEliminarProveedorLabel" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog">
            <form class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="modalEliminarProveedorLabel"><i class="bi bi-exclamation-triangle-fill"></i> Desactivar Proveedor</h5>
                </div>
                <div class="modal-body">
                    <p class="text-center fw-bold">¿Deseas desactivar este proveedor?</p>
                    <p class="text-center text-muted small">El proveedor no será eliminado y podrá reactivarse más adelante.</p>
                    <input type="hidden" id="del_id">
                    <ul class="list-group mb-3">
                        <li class="list-group-item"><strong>Razón Social:</strong> <span id="del_legal_name"></span></li>
                        <li class="list-group-item"><strong>RUC / Cédula:</strong> <span id="del_ruc"></span></li>
                        <li class="list-group-item"><strong>Teléfono:</strong> <span id="del_tel"></span></li>
                        <li class="list-group-item"><strong>Correo:</strong> <span id="del_email"></span></li>
                        <li class="list-group-item"><strong>Dirección:</strong> <span id="del_address"></span></li>
                        <li class="list-group-item"><strong>Ciudad:</strong> <span id="del_city"></span></li>
                    </ul>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="reset" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cancelar</button>
                    <button class="btn btn-secondary" type="button" onclick="btnEliminarProveedor()"><i class="bi bi-x-circle"></i> Desactivar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MENU -->
    <script src="menu/scripts.js"></script>
    <!-- BOOTSTRAP -->
    <script src="bt/bootstrap.bundle.min.js"></script>
    <!-- ALERTIFY -->
    <script src="alert/alertify.min.js"></script>
    <!-- DATATABLES -->
    <script src="dt/jquery-3.7.1.js"></script>
    <script src="dt/datatables.min.js"></script>
    <script src="dt/jquery.dataTables.min.js"></script>
    <script src="dt/es-ES.js"></script>
    <!-- DATATABLES Buttons extension -->
    <script src="dt/dataTables.buttons.min.js"></script>
    <script src="dt/buttons.print.min.js"></script>
    <script src="dt/buttons.html5.min.js"></script>
    <!-- DATATABLES JSZip y pdfmake para exportar -->
    <script src="dt/jszip.min.js"></script>
    <script src="dt/pdfmake.min.js"></script>
    <script src="dt/vfs_fonts.js"></script>
    <!-- SCRIPTS -->
    <script src="js/bd.js"></script>
    <script src="js/alertas.js"></script>
    <script src="js/tablas.js"></script>
    <script src="js/proveedores.js"></script>
</body>
</html>
