<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Vanguardia - Ventas</title>
    <link rel="icon" href="img/logo_x16.jpg">
    <link href="menu/styles.css" rel="stylesheet"/>
    <link rel="stylesheet" href="bt/bootstrap.min.css">
    <link rel="stylesheet" href="bt-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="alert/alertify.min.css">
    <link rel="stylesheet" href="alert/themes/default.min.css">
    <link rel="stylesheet" href="dt/datatables.min.css">
    <link rel="stylesheet" href="dt/jquery.dataTables.min.css">
    <link rel="stylesheet" href="dt/buttons.dataTables.min.css">
    <link rel="stylesheet" href="css/vanguardia.css">
</head>
<body class="sb-nav-fixed">
    <div id="contenedor-navbar">
        <!-- ========================================================= -->
        <!-- 1. CONTENEDOR DINÁMICO PARA LA BARRA SUPERIOR (NAVBAR)    -->
        <!-- Este div vacío será llenado por JavaScript usando fetch() -->
        <!-- con el contenido del archivo 'navbar.html'.               -->
        <!-- ========================================================= -->
    </div>
    <div id="layoutSidenav">
        <div id="contenedor-sidebar">
            <!-- ========================================================= -->
            <!-- 2. CONTENEDOR DINÁMICO PARA EL MENÚ LATERAL (SIDEBAR)     -->
            <!-- Este div vacío será llenado por JavaScript usando fetch() -->
            <!-- con el contenido del archivo 'sidebar.html'.              -->
            <!-- ========================================================= -->
        </div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <div class="d-flex justify-content-between align-items-center mt-2 mb-2">
                        <h1 class="mb-0">Ventas</h1>
                        <button class="btn btn-sm btn-primary" onclick="$('#modalNuevaVenta').modal('show')">
                            <i class="bi bi-cart-check-fill me-1"></i> Nueva Venta
                        </button>
                    </div>
                    <div class="row">
                        <table id="tabla_ventas" class="display compact" style="width:100%">
                            <thead>
                                <tr>
                                    <th>Id Venta</th>
                                    <th>Cliente</th>
                                    <th>Usuario</th>
                                    <th>Tipo Pago</th>
                                    <th>Total</th>
                                    <th>Fecha</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                        </table>
                    </div>
                </div>
            </main>
            <footer class="py-4 bg-light mt-auto" id="contenedor-footer">
                <!-- ========================================================= -->
                <!-- 3. CONTENEDOR DINÁMICO PARA EL PIE DE PAGINA (FOOTER)     -->
                <!-- Este div vacío será llenado por JavaScript usando fetch() -->
                <!-- con el contenido del archivo 'footer.html'.               -->
                <!-- ========================================================= -->
            </footer>
        </div>
    </div>

    <!-- Modal Nueva Venta -->
    <div class="modal fade modal-lg" id="modalNuevaVenta" tabindex="-1" aria-labelledby="modalNuevaVentaLabel" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog">
            <form id="formNuevaVenta" class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalNuevaVentaLabel"><i class="bi bi-cart-check-fill"></i> Registrar Nueva Venta</h5>
                </div>
                <div class="modal-body">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Cliente</label>
                            <select id="client_id" class="form-select" required></select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Tipo de Pago</label>
                            <select id="payment_type" class="form-select" required>
                                <option value="CONTADO">CONTADO</option>
                                <option value="CREDITO">CRÉDITO</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Observaciones</label>
                        <input type="text" id="obs" class="form-control text-uppercase" maxlength="100">
                    </div>
                    
                    <hr>
                    <h6 class="fw-bold">Detalle de Productos</h6>
                    <div class="row mb-2">
                        <div class="col-md-5">
                            <select id="producto_select" class="form-select">
                                <option value="">Seleccione un producto...</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <input type="number" id="cantidad_input" class="form-control" placeholder="Cantidad" min="1">
                        </div>
                        <div class="col-md-3">
                            <input type="number" id="precio_input" class="form-control" placeholder="Precio Unit." readonly>
                        </div>
                        <div class="col-md-1">
                            <button type="button" class="btn btn-success w-100" id="btnAgregarDetalle"><i class="bi bi-plus-lg"></i></button>
                        </div>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table table-sm table-bordered" id="tabla_detalles_venta">
                            <thead class="table-light">
                                <tr>
                                    <th>Producto</th>
                                    <th>Cantidad</th>
                                    <th>Precio Unit.</th>
                                    <th>Subtotal</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Detalles dinámicos -->
                            </tbody>
                            <tfoot>
                                <tr>
                                    <th colspan="3" class="text-end">Total:</th>
                                    <th id="total_venta">0</th>
                                    <th></th>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="reset" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cancelar</button>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-floppy"></i> Guardar Venta</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Ver Detalles Venta -->
    <div class="modal fade modal-lg" id="modalVerDetalles" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title"><i class="bi bi-info-circle"></i> Detalles de la Venta #<span id="ver_venta_id"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row mb-3">
                        <div class="col-md-6"><strong>Cliente:</strong> <span id="ver_cliente"></span></div>
                        <div class="col-md-6"><strong>Fecha:</strong> <span id="ver_fecha"></span></div>
                        <div class="col-md-6"><strong>Usuario:</strong> <span id="ver_usuario"></span></div>
                        <div class="col-md-6"><strong>Tipo Pago:</strong> <span id="ver_tipo_pago"></span></div>
                        <div class="col-12 mt-2"><strong>Obs:</strong> <span id="ver_obs"></span></div>
                    </div>
                    <table class="table table-sm table-bordered" id="tabla_ver_detalles">
                        <thead class="table-light">
                            <tr>
                                <th>Producto</th>
                                <th>Cantidad</th>
                                <th>Precio Unit.</th>
                                <th>Subtotal</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                        <tfoot>
                            <tr>
                                <th colspan="3" class="text-end">Total:</th>
                                <th id="ver_total_venta">0</th>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="menu/scripts.js"></script>
    <script src="bt/bootstrap.bundle.min.js"></script>
    <script src="alert/alertify.min.js"></script>
    <script src="dt/jquery-3.7.1.js"></script>
    <script src="dt/datatables.min.js"></script>
    <script src="dt/jquery.dataTables.min.js"></script>
    <script src="dt/dataTables.buttons.min.js"></script>
    <script src="dt/buttons.print.min.js"></script>
    <script src="dt/buttons.html5.min.js"></script>
    <script src="dt/jszip.min.js"></script>
    <script src="dt/pdfmake.min.js"></script>
    <script src="dt/vfs_fonts.js"></script>
    <script src="dt/es-ES.js"></script>
    <script src="js/bd.js"></script>
    <script src="js/alertas.js"></script>
    <script src="js/ventas.js"></script>
</body>
</html>
