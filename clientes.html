<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Vanguardia - Menu</title>
    <link rel="icon" href="img/logo_x16.jpg">
    <!-- ESTILOS DEL MENU -->
    <link href="menu/styles.css" rel="stylesheet"/>
    <!-- BOOTSTRAP -->
    <link rel="stylesheet" href="bt/bootstrap.min.css">
    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="bt-icons/bootstrap-icons.min.css">
    <!-- ALERTIFY -->
    <link rel="stylesheet" href="alert/alertify.min.css">
    <link rel="stylesheet" href="alert/themes/default.min.css">
    <!-- DATATABLES -->
    <link rel="stylesheet" href="dt/datatables.min.css">
    <link rel="stylesheet" href="dt/jquery.dataTables.min.css">
    <link rel="stylesheet" href="dt/buttons.dataTables.min.css">
    <!-- TEMA VANGUARDIA -->
    <link rel="stylesheet" href="css/vanguardia.css">
</head>
<body class="sb-nav-fixed">
    <div id="contenedor-navbar">
        <!-- ========================================================= -->
        <!-- 1. CONTENEDOR DINÁMICO PARA LA BARRA SUPERIOR (NAVBAR)    -->
        <!-- Este div vacío será llenado por JavaScript usando fetch() -->
        <!-- con el contenido del archivo 'navbar.html'.               -->
        <!-- ========================================================= -->
    </div>
    <div id="layoutSidenav">
        <div id="contenedor-sidebar">
            <!-- ========================================================= -->
            <!-- 2. CONTENEDOR DINÁMICO PARA EL MENÚ LATERAL (SIDEBAR)     -->
            <!-- Este div vacío será llenado por JavaScript usando fetch() -->
            <!-- con el contenido del archivo 'sidebar.html'.              -->
            <!-- ========================================================= -->
        </div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <!-- BOTON NUEVO CLIENTE -->
                    <div class="d-flex justify-content-between align-items-center mt-2 mb-2">
                        <h1 class="mb-0">Clientes</h1>
                        <button class="btn btn-sm btn-primary" id="btnModalNuevo" type="button" onclick="ventanaNuevoCliente()">
                            <i class="bi bi-person-plus-fill me-1"></i> Nuevo cliente
                        </button>
                    </div>

                    <!-- PANEL DE FILTROS -->
                    <div class="row mb-3">
                        <div class="col-12">
                            <div class="card"
                                style="background:rgba(255,255,255,0.65);
                                        border:1px solid rgba(100,160,255,0.3);
                                        box-shadow:0 8px 32px rgba(30,80,180,0.12);
                                        border-radius:12px;
                                        backdrop-filter:blur(6px);">
                                <!-- HEADER CLICKABLE -->
                                <div class="card-header py-2 px-3 d-flex justify-content-between align-items-center"
                                    style="background:rgba(30,80,180,0.9);
                                            color:white;
                                            border-radius:11px 11px 0 0;
                                            cursor:pointer;"
                                    data-bs-toggle="collapse"
                                    data-bs-target="#panelFiltrosFinal"
                                    aria-expanded="true">
                                    <span>
                                        <i class="bi bi-funnel-fill me-1"></i>
                                        <strong>Filtros</strong>
                                    </span>
                                    <i class="bi bi-chevron-down"></i>
                                </div>
                                <!-- COLLAPSE BODY -->
                                <div class="collapse show" id="panelFiltrosFinal">
                                    <div class="card-body py-3">
                                        <div class="row g-3 align-items-end">
                                            <div class="col-md-2 col-sm-6">
                                                <label for="filtro_estado" class="form-label fw-semibold small mb-1" style="color:#0d2149">
                                                    Estado
                                                </label>
                                                <select class="form-select"
                                                        id="filtro_estado"
                                                        onchange="cargarDatos()">
                                                    <option value="ACTIVO">Activos</option>
                                                    <option value="INACTIVO">Inactivos</option>
                                                    <option value="" selected>Todos</option>
                                                </select>
                                            </div>
                                            <div class="col-md-2 col-sm-6">
                                                <label for="filtro_creacion_desde" class="form-label fw-semibold small mb-1" style="color:#0d2149">
                                                    Creado Desde
                                                </label>
                                                <input class="form-control"
                                                    id="filtro_creacion_desde"
                                                    type="date"
                                                    onchange="cargarDatos()">
                                            </div>
                                            <div class="col-md-2 col-sm-6">
                                                <label for="filtro_creacion_hasta" class="form-label fw-semibold small mb-1" style="color:#0d2149">
                                                    Creado Hasta
                                                </label>
                                                <input class="form-control"
                                                    id="filtro_creacion_hasta"
                                                    type="date"
                                                    onchange="cargarDatos()">
                                            </div>
                                            <!-- Modificado Desde -->
                                            <div class="col-md-2 col-sm-6">
                                                <label for="filtro_modificacion_desde" class="form-label fw-semibold small mb-1" style="color:#0d2149">
                                                    Modificado Desde
                                                </label>
                                                <input class="form-control"
                                                    id="filtro_modificacion_desde"
                                                    type="date"
                                                    onchange="cargarDatos()">
                                            </div>

                                            <!-- Modificado Hasta -->
                                            <div class="col-md-2 col-sm-6">
                                                <label for="filtro_modificacion_hasta" class="form-label fw-semibold small mb-1" style="color:#0d2149">
                                                    Modificado Hasta
                                                </label>
                                                <input class="form-control"
                                                    id="filtro_modificacion_hasta"
                                                    type="date"
                                                    onchange="cargarDatos()">
                                            </div>

                                            <!-- Botón Limpiar -->
                                            <div class="col-md-2 d-flex gap-1 align-items-end">
                                                <button class="btn btn-sm btn-outline-secondary flex-fill"
                                                        onclick="btnLimpiarFiltros()">
                                                    <i class="bi bi-x-circle"></i> Limpiar
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TABLA -->
                    <div class="row">
                        <table id="tabla_clientes" class="display compact" style="width:100%">
                        </table>
                    </div>
                </div>
            </main>
            <footer class="py-4 bg-light mt-auto" id="contenedor-footer">
                <!-- ========================================================= -->
                <!-- 3. CONTENEDOR DINÁMICO PARA EL PIE DE PAGINA (FOOTER)     -->
                <!-- Este div vacío será llenado por JavaScript usando fetch() -->
                <!-- con el contenido del archivo 'footer.html'.               -->
                <!-- ========================================================= -->
            </footer>
        </div>
    </div>

    <!-- Modal Nuevo Cliente -->
    <div class="modal fade" id="modalNuevoCliente" tabindex="-1" aria-labelledby="modalNuevoClienteLabel" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog">
            <form class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalNuevoClienteLabel"><i class="bi bi-person-plus-fill"></i> Agregar Nuevo Cliente</h5>
                </div>
                <div class="modal-body">
                    <div class="mb-2">
                        <label class="form-label">Razón Social</label>
                        <input type="text" id="razonsocial" class="form-control text-uppercase" minlength="5" maxlength="50" pattern="^[a-zA-ZñÑáéíóúÁÉÍÓÚüÜ\s'\.,&\-]{5,50}$" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">RUC/Cédula</label>
                        <input type="text" id="ruc" class="form-control text-uppercase" pattern="^\d{5,8}[A-Z]?(-\d)?$" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Teléfono</label>
                        <input type="text" id="telefono" class="form-control" pattern="^09\d{8}$" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="text" id="correo" class="form-control" pattern="[^\s@]+@[^\s@]+\.[^\s@]{2,}" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Dirección</label>
                        <input type="text" id="direccion" class="form-control text-uppercase" minlength="5" maxlength="50" pattern="^[a-zA-Z0-9ñÑáéíóúÁÉÍÓÚüÜ\s,.:°#\/\-]{5,50}$" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="reset" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cancelar</button>
                    <button class="btn btn-primary" type="button" onclick="btnNuevoCliente()"><i class="bi bi-floppy"></i> Guardar Cliente</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Editar Cliente -->
    <div class="modal fade" id="modalEditarCliente" tabindex="-1" aria-labelledby="modalEditarClienteLabel" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog">
            <form class="modal-content">
                <div class="modal-header bg-warning text-dark">
                    <h5 class="modal-title" id="modalEditarClienteLabel"><i class="bi bi-pencil-square"></i> Editar Cliente</h5>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="edit_id">
                    <div class="mb-2">
                        <label class="form-label">Razón Social</label>
                        <input type="text" id="edit_razonsocial" class="form-control text-uppercase" minlength="5" maxlength="50" pattern="^[a-zA-ZñÑáéíóúÁÉÍÓÚüÜ\s'\.,&\-]{5,50}$" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">RUC/Cédula</label>
                        <input type="text" id="edit_ruc" class="form-control text-uppercase" pattern="^\d{5,8}[A-Z]?(-\d)?$" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Teléfono</label>
                        <input type="text" id="edit_telefono" class="form-control" pattern="^09\d{8}$" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="text" id="edit_correo" class="form-control" pattern="[^\s@]+@[^\s@]+\.[^\s@]{2,}" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Dirección</label>
                        <input type="text" id="edit_direccion" class="form-control text-uppercase" minlength="5" maxlength="50" pattern="^[a-zA-Z0-9ñÑáéíóúÁÉÍÓÚüÜ\s,.:°#/-]{5,50}$" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="reset" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cancelar</button>
                    <button class="btn btn-warning" type="button" onclick="btnEditarCliente()"><i class="bi bi-floppy"></i> Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Eliminar Cliente -->
    <div class="modal fade" id="modalEliminarCliente" tabindex="-1" aria-labelledby="modalEliminarClienteLabel" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog">
            <form class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="modalEliminarClienteLabel"><i class="bi bi-exclamation-triangle-fill"></i> Eliminar Cliente</h5>
                </div>
                <div class="modal-body">
                    <p class="text-center fw-bold">¿Deseas proceder con la eliminación?</p>
                    <input type="hidden" id="del_id">
                    <ul class="list-group mb-3">
                        <li class="list-group-item"><strong>Razón Social:</strong> <span id="del_razonsocial"></span></li>
                        <li class="list-group-item"><strong>RUC:</strong> <span id="del_ruc"></span></li>
                        <li class="list-group-item"><strong>Dirección:</strong> <span id="del_direccion"></span></li>
                        <li class="list-group-item"><strong>Teléfono:</strong> <span id="del_telefono"></span></li>
                    </ul>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="reset" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cancelar</button>
                    <button class="btn btn-danger" type="button" onclick="btnEliminarCliente()"><i class="bi bi-trash"></i> Eliminar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MENU -->
    <script src="menu/scripts.js"></script>
    <!-- BOOTSTRAP -->
    <script src="bt/bootstrap.bundle.min.js"></script>
    <!-- ALERTIFY -->
    <script src="alert/alertify.min.js"></script>
    <!-- DATATABLES -->
    <script src="dt/jquery-3.7.1.js"></script>
    <script src="dt/datatables.min.js"></script>
    <script src="dt/jquery.dataTables.min.js"></script>
    <script src="dt/es-ES.js"></script>
    <!-- DATATABLES Buttons extension -->
    <script src="dt/dataTables.buttons.min.js"></script>
    <script src="dt/buttons.print.min.js"></script>
    <script src="dt/buttons.html5.min.js"></script>
    <!-- DATATABLES JSZip y pdfmake para exportar -->
    <script src="dt/jszip.min.js"></script>
    <script src="dt/pdfmake.min.js"></script>
    <script src="dt/vfs_fonts.js"></script>
    <!-- SCRIPTS -->
    <script src="js/bd.js"></script>
    <script src="js/alertas.js"></script>
    <script src="js/tablas.js"></script>
    <script src="js/clientes.js"></script>
</body>
</html>
