<!DOCTYPE html>
<html lang="es">
<head>
     <meta charset="utf-8" />
     <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
     <title>Vanguardia - Clientes</title>
     <link rel="icon" type="image/png" href="img/working.png">
     <!-- ESTILOS DEL MENU -->
     <link href="menu/styles.css" rel="stylesheet" />
     <!-- TEMA VANGUARDIA -->
     <link rel="stylesheet" href="css/vanguardia.css">
     <!-- BOOTSTRAP ICONS -->
     <link rel="stylesheet" href="bt-icons/bootstrap-icons.min.css">
     <!-- DATATABLES -->
     <link rel="stylesheet" href="dt/datatables.min.css">
     <link rel="stylesheet" href="dt/jquery.dataTables.min.css">
     <link rel="stylesheet" href="dt/buttons.dataTables.min.css">
     <!-- ALERTIFYJS -->
     <link rel="stylesheet" href="alert/alertify.min.css">
     <link rel="stylesheet" href="alert/themes/default.min.css">
     <script src="alert/alertify.min.js"></script>
</head>
<body class="sb-nav-fixed">
     <div id="contenedor-navbar"></div> <!-- ??? -->
     <div id="layoutSidenav">
          <div id="contenedor-sidebar"></div> <!-- ??? -->
          <div id="layoutSidenav_content">
               <main>
                    <div class="container-fluid px-4">
                         <h1 class="mt-2">Clientes</h1>
                         <div class="row">
                              <table id="tabla_clientes" class="display compact" style="width:100%">
                                   <thead>
                                        <tr>
                                             <th>Id Cliente</th>
                                             <th>N° Cédula</th>
                                             <th>Nombre</th>
                                             <th>Dirección</th>
                                             <th>Teléfono</th>
                                             <th>Acciones</th>
                                        </tr>
                                   </thead>
                              </table>
                         </div>
                    </div>
               </main>
               <footer class="py-4 bg-light mt-auto">
                    <div class="container-fluid px-4">
                         <div class="d-flex align-items-center justify-content-between small">
                              <div class="text-muted">Copyright &copy; Vanguardia 2026</div>
                              <div>
                                   <a href="#">Privacy Policy</a>
                                   &middot;
                                   <a href="#">Terms &amp; Conditions</a>
                              </div>
                         </div>
                    </div>
               </footer>
          </div>
     </div>

     <!-- Modal Nuevo Cliente -->
     <div class="modal fade" id="nuevoCliente" tabindex="-1" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" aria-labelledby="nuevoClienteLabel">
          <div class="modal-dialog">
               <form id="formNuevoCliente" class="modal-content">
                    <div class="modal-header bg-primary text-white">
                         <h5 class="modal-title" id="nuevoClienteLabel"><i class="bi bi-person-plus-fill"></i> Agregar Nuevo Cliente</h5>
                         <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                         <div class="mb-2">
                              <label class="form-label">N° Cédula</label>
                              <input type="number" id="cedula" class="form-control" required min="100000" max="99999999">
                         </div>
                         <div class="mb-2">
                              <label class="form-label">Nombre completo</label>
                              <input type="text" id="nombre" class="form-control text-uppercase" required minlength="5" maxlength="50">
                         </div>
                         <div class="mb-2">
                              <label class="form-label">Dirección</label>
                              <input type="text" id="direccion" class="form-control text-uppercase" required minlength="5" maxlength="50">
                         </div>
                         <div class="mb-2">
                              <label class="form-label">Teléfono</label>
                              <input type="text" id="telefono" class="form-control" required minlength="6" maxlength="15">
                         </div>
                    </div>
                    <div class="modal-footer">
                         <button type="reset" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cancelar</button>
                         <button type="submit" class="btn btn-primary"><i class="bi bi-floppy"></i> Guardar Cliente</button>
                    </div>
               </form>
          </div>
     </div>

     <!-- Modal Editar Cliente -->
     <div class="modal fade" id="modalEditarCliente" tabindex="-1" aria-labelledby="modalEditarClienteLabel" aria-hidden="true" data-bs-backdrop="static">
          <div class="modal-dialog">
               <form id="formEditarCliente" class="modal-content">
                    <div class="modal-header bg-warning text-dark">
                         <h5 class="modal-title" id="modalEditarClienteLabel"><i class="bi bi-pencil-square"></i> Editar Cliente</h5>
                         <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                         <input type="hidden" id="edit_idcliente">
                         <div class="mb-2">
                              <label class="form-label">N° Cédula</label>
                              <input type="number" id="edit_cedula" class="form-control" required min="100000" max="99999999">
                         </div>
                         <div class="mb-2">
                              <label class="form-label">Nombre completo</label>
                              <input type="text" id="edit_nombre" class="form-control text-uppercase" required minlength="5" maxlength="50">
                         </div>
                         <div class="mb-2">
                              <label class="form-label">Dirección</label>
                              <input type="text" id="edit_direccion" class="form-control text-uppercase" required minlength="5" maxlength="50">
                         </div>
                         <div class="mb-2">
                              <label class="form-label">Teléfono</label>
                              <input type="text" id="edit_telefono" class="form-control" required minlength="6" maxlength="15">
                         </div>
                    </div>
                    <div class="modal-footer">
                         <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cancelar</button>
                         <button type="submit" class="btn btn-warning"><i class="bi bi-floppy"></i> Guardar Cambios</button>
                    </div>
               </form>
          </div>
     </div>

     <!-- Modal Eliminar Cliente -->
     <div class="modal fade" id="modalEliminarCliente" tabindex="-1" aria-labelledby="modalEliminarClienteLabel" aria-hidden="true" data-bs-backdrop="static">
          <div class="modal-dialog">
               <div class="modal-content">
                    <div class="modal-header bg-danger text-white">
                         <h5 class="modal-title" id="modalEliminarClienteLabel"><i class="bi bi-exclamation-triangle-fill"></i> Eliminar Cliente</h5>
                         <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                         <p class="text-center fw-bold">¿Deseas proceder con la eliminación?</p>
                         <input type="hidden" id="del_idcliente">
                         <ul class="list-group mb-3">
                              <li class="list-group-item"><strong>Cédula:</strong> <span id="del_cedula"></span></li>
                              <li class="list-group-item"><strong>Nombre:</strong> <span id="del_nombre"></span></li>
                              <li class="list-group-item"><strong>Dirección:</strong> <span id="del_direccion"></span></li>
                              <li class="list-group-item"><strong>Teléfono:</strong> <span id="del_telefono"></span></li>
                         </ul>
                    </div>
                    <div class="modal-footer">
                         <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cancelar</button>
                         <button type="button" class="btn btn-danger" id="btnConfirmarEliminar"><i class="bi bi-trash"></i> Eliminar</button>
                    </div>
               </div>
          </div>
     </div>
     <!-- DATATABLES -->
     <script src="dt/jquery-3.7.1.js"></script>
     <script src="dt/datatables.min.js"></script>
     <script src="dt/jquery.dataTables.min.js"></script>
     <!-- DATATABLES Buttons extension -->
     <script src="dt/dataTables.buttons.min.js"></script>
     <script src="dt/buttons.print.min.js"></script>
     <script src="dt/buttons.html5.min.js"></script>
     <!-- DATATABLES JSZip y pdfmake para exportar -->
     <script src="dt/jszip.min.js"></script>
     <script src="dt/pdfmake.min.js"></script>
     <script src="dt/vfs_fonts.js"></script>
     <!-- DATATABLES Idioma Español -->
     <script src="dt/es-ES.js"></script>
     <script src="js/alertas.js"></script>
     <script src="js/funcionesSistema.js"></script>
     <!-- MENU -->
     <script src="menu/bootstrap.bundle.min.js"></script>
     <script src="menu/scripts.js"></script>
</body>
</html>
