<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Vanguardia - Roles</title>
    <link rel="icon" href="img/logo_x16.jpg">
    <link href="menu/styles.css" rel="stylesheet"/>
    <link rel="stylesheet" href="bt/bootstrap.min.css">
    <link rel="stylesheet" href="bt-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="alert/alertify.min.css">
    <link rel="stylesheet" href="alert/themes/default.min.css">
    <link rel="stylesheet" href="dt/datatables.min.css">
    <link rel="stylesheet" href="dt/jquery.dataTables.min.css">
    <link rel="stylesheet" href="dt/buttons.dataTables.min.css">
    <link rel="stylesheet" href="css/vanguardia.css">
</head>
<body class="sb-nav-fixed">
    <div id="contenedor-navbar"></div>
    <div id="layoutSidenav">
        <div id="contenedor-sidebar"></div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <div class="d-flex justify-content-between align-items-center mt-2 mb-2">
                        <h1 class="mb-0">Roles</h1>
                        <button class="btn btn-sm btn-success" onclick="abrirModalNuevo()">
                            <i class="bi bi-plus-circle me-1"></i> Nuevo Rol
                        </button>
                    </div>

                    <!-- PANEL DE FILTROS -->
                    <div class="row mb-3">
                        <div class="col-12">
                            <div class="card"
                                style="background:rgba(255,255,255,0.65);
                                        border:1px solid rgba(100,160,255,0.3);
                                        box-shadow:0 8px 32px rgba(30,80,180,0.12);
                                        border-radius:12px;
                                        backdrop-filter:blur(6px);">
                                <!-- HEADER CLICKABLE -->
                                <div class="card-header py-2 px-3 d-flex justify-content-between align-items-center"
                                    style="background:rgba(30,80,180,0.9);
                                            color:white;
                                            border-radius:11px 11px 0 0;
                                            cursor:pointer;"
                                    data-bs-toggle="collapse"
                                    data-bs-target="#panelFiltros2"
                                    aria-expanded="true">
                                    <span>
                                        <i class="bi bi-funnel-fill me-1"></i>
                                        <strong>Filtros</strong>
                                    </span>
                                    <i class="bi bi-chevron-down"></i>
                                </div>
                                <!-- COLLAPSE BODY -->
                                <div class="collapse show" id="panelFiltros2">
                                    <div class="card-body py-3">
                                        <div class="row g-3 align-items-end">
                                            <div class="col-md-3 col-sm-6">
                                                <label for="filtro_fecha_desde" class="form-label fw-semibold small mb-1" style="color:#0d2149">
                                                    Creado Desde
                                                </label>
                                                <input type="date"
                                                    id="filtro_fecha_desde"
                                                    class="form-control form-control-sm"
                                                    onchange="cargarDatos()"
                                                    style="background-color:rgba(255,255,255,0.9);
                                                            border:1px solid rgba(30,80,180,0.3);
                                                            color:#0d2149;
                                                            border-radius:6px;">
                                            </div>
                                            <div class="col-md-3 col-sm-6">
                                                <label for="filtro_fecha_hasta" class="form-label fw-semibold small mb-1" style="color:#0d2149">
                                                    Creado Hasta
                                                </label>
                                                <input type="date"
                                                    id="filtro_fecha_hasta"
                                                    class="form-control form-control-sm"
                                                    onchange="cargarDatos()"
                                                    style="background-color:rgba(255,255,255,0.9);
                                                            border:1px solid rgba(30,80,180,0.3);
                                                            color:#0d2149;
                                                            border-radius:6px;">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TABLA -->
                    <div class="row">
                        <table id="tabla_roles" class="display compact" style="width:100%"></table>
                    </div>
                </div>
            </main>
            <footer class="py-4 bg-light mt-auto" id="contenedor-footer"></footer>
        </div>
    </div>

    <!-- MODAL NUEVO / EDITAR ROL -->
    <div class="modal fade" id="modalRol" tabindex="-1" aria-hidden="true"
         data-bs-backdrop="static" data-bs-keyboard="false" aria-labelledby="modalRolLabel">
        <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="modalRolLabel">Nuevo Rol</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="rol_id">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold" for="rol_nombre">
                                Nombre <span class="text-danger">*</span>
                            </label>
                            <input class="form-control text-uppercase" id="rol_nombre" type="text"
                                   maxlength="30" placeholder="Ej: ADMINISTRADOR">
                            <div class="invalid-feedback" id="error_nombre"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold" for="rol_descripcion">Descripción</label>
                            <textarea class="form-control" id="rol_descripcion" rows="1"
                                      maxlength="100" placeholder="Descripción del rol..."></textarea>
                            <div class="invalid-feedback" id="error_descripcion"></div>
                        </div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label fw-semibold">Permisos del Rol</label>
                        <div class="row" id="contenedor_permisos">
                            <!-- Los checkboxes de permisos se generarán dinámicamente -->
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </button>
                    <button type="button" class="btn btn-success" onclick="guardarRolForm()">
                        <i class="bi bi-check-circle"></i> Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL CONFIRMAR ELIMINAR -->
    <div class="modal fade" id="modalEliminar" tabindex="-1" aria-hidden="true"
         data-bs-backdrop="static" data-bs-keyboard="false" aria-labelledby="modalEliminarLabel">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="modalEliminarLabel">
                        <i class="bi bi-exclamation-triangle"></i> Eliminar Rol
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>¿Está seguro que desea eliminar el rol <strong id="nombre_a_eliminar"></strong>?</p>
                    <p class="text-danger small mb-0">
                        <i class="bi bi-exclamation-circle"></i>
                        Esta acción no se puede deshacer. Si el rol tiene usuarios asignados, no podrá eliminarse.
                    </p>
                    <input type="hidden" id="id_a_eliminar">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </button>
                    <button type="button" class="btn btn-danger" onclick="confirmarEliminar()">
                        <i class="bi bi-trash"></i> Eliminar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.modal').forEach((modal) => {
            modal.addEventListener('hide.bs.modal', () => {
                document.activeElement.blur();
            });
        });
    </script>

    <script src="menu/scripts.js"></script>
    <script src="bt/bootstrap.bundle.min.js"></script>
    <script src="alert/alertify.min.js"></script>
    <script src="dt/jquery-3.7.1.js"></script>
    <script src="dt/datatables.min.js"></script>
    <script src="dt/jquery.dataTables.min.js"></script>
    <script src="dt/dataTables.buttons.min.js"></script>
    <script src="dt/buttons.print.min.js"></script>
    <script src="dt/buttons.html5.min.js"></script>
    <script src="dt/jszip.min.js"></script>
    <script src="dt/pdfmake.min.js"></script>
    <script src="dt/vfs_fonts.js"></script>
    <script src="dt/es-ES.js"></script>
    <script src="js/bd.js"></script>
    <script src="js/alertas.js"></script>
    <script src="js/tablas.js"></script>
    <script src="js/roles.js"></script>
</body>
</html>
