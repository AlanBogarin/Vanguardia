<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Vanguardia - Cobros</title>
    <link rel="icon" href="img/logo_x16.jpg">
    <!-- ESTILOS DEL MENU -->
    <link href="menu/styles.css" rel="stylesheet"/>
    <!-- BOOTSTRAP -->
    <link rel="stylesheet" href="bt/bootstrap.min.css">
    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="bt-icons/bootstrap-icons.min.css">
    <!-- ALERTIFY -->
    <link rel="stylesheet" href="alert/alertify.min.css">
    <link rel="stylesheet" href="alert/themes/default.min.css">
    <!-- DATATABLES -->
    <link rel="stylesheet" href="dt/datatables.min.css">
    <link rel="stylesheet" href="dt/jquery.dataTables.min.css">
    <link rel="stylesheet" href="dt/buttons.dataTables.min.css">
    <!-- TEMA VANGUARDIA -->
    <link rel="stylesheet" href="css/vanguardia.css">
</head>
<body class="sb-nav-fixed">
    <div id="contenedor-navbar"></div>
    <div id="layoutSidenav">
        <div id="contenedor-sidebar"></div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <div class="d-flex justify-content-between align-items-center mt-2 mb-2">
                        <div>
                            <h1 class="mb-0 d-inline-block me-3">Cobros a Clientes</h1>
                        </div>
                        <button class="btn btn-sm btn-primary" id="btnModalNuevo" onclick="modalNuevo.show()">
                            <i class="bi bi-cash-stack me-1"></i> Registrar Nuevo Cobro
                        </button>
                    </div>

                    <!-- PANEL DE FILTROS -->
                    <div class="row mb-3">
                        <div class="col-12">
                            <div class="card"
                                style="background:rgba(255,255,255,0.65);
                                        border:1px solid rgba(100,160,255,0.3);
                                        box-shadow:0 8px 32px rgba(30,80,180,0.12);
                                        border-radius:12px;
                                        backdrop-filter:blur(6px);">
                                <!-- HEADER CLICKABLE -->
                                <div class="card-header py-2 px-3 d-flex justify-content-between align-items-center"
                                    style="background:rgba(30,80,180,0.9);
                                            color:white;
                                            border-radius:11px 11px 0 0;
                                            cursor:pointer;"
                                    data-bs-toggle="collapse"
                                    data-bs-target="#panelFiltrosMetodosCobro"
                                    aria-expanded="true">
                                    <span>
                                        <i class="bi bi-funnel-fill me-1"></i>
                                        <strong>Filtros</strong>
                                    </span>
                                    <i class="bi bi-chevron-down"></i>
                                </div>
                                <!-- COLLAPSE BODY -->
                                <div class="collapse show" id="panelFiltrosMetodosCobro">
                                    <div class="card-body py-3">
                                        <div class="row g-3 align-items-end">
                                            <div class="col-md-4 col-sm-6">
                                                <label for="filtro_metodo" class="form-label fw-semibold small mb-1" style="color:#0d2149">
                                                    Método de Cobro
                                                </label>
                                                <select id="filtro_metodo"
                                                        class="form-select form-select-sm"
                                                        onchange="cargarDatos()"
                                                        style="background-color:rgba(255,255,255,0.9);
                                                            border:1px solid rgba(30,80,180,0.3);
                                                            color:#0d2149;
                                                            border-radius:6px;">
                                                    <option value="">Todos</option>
                                                    <option value="Efectivo">Efectivo</option>
                                                    <option value="Transferencia Bancaria">Transferencia Bancaria</option>
                                                    <option value="Tarjeta de Crédito">Tarjeta de Crédito</option>
                                                    <option value="Tarjeta de Débito">Tarjeta de Débito</option>
                                                    <option value="Cheque">Cheque</option>
                                                </select>
                                            </div>
                                            <div class="col-md-4 col-sm-6">
                                                <label for="filtro_fecha_desde" class="form-label fw-semibold small mb-1" style="color:#0d2149">
                                                    Cobrado Desde
                                                </label>
                                                <input type="date"
                                                    id="filtro_fecha_desde"
                                                    class="form-control form-control-sm"
                                                    onchange="cargarDatos()"
                                                    style="background-color:rgba(255,255,255,0.9);
                                                            border:1px solid rgba(30,80,180,0.3);
                                                            color:#0d2149;
                                                            border-radius:6px;">
                                            </div>
                                            <div class="col-md-4 col-sm-6">
                                                <label for="filtro_fecha_hasta" class="form-label fw-semibold small mb-1" style="color:#0d2149">
                                                    Cobrado Hasta
                                                </label>
                                                <input type="date"
                                                    id="filtro_fecha_hasta"
                                                    class="form-control form-control-sm"
                                                    onchange="cargarDatos()"
                                                    style="background-color:rgba(255,255,255,0.9);
                                                            border:1px solid rgba(30,80,180,0.3);
                                                            color:#0d2149;
                                                            border-radius:6px;">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TABLA -->
                    <div class="row">
                        <table id="tabla_cobros" class="display compact" style="width:100%">
                        </table>
                    </div>
                </div>
            </main>
            <footer class="py-4 bg-light mt-auto" id="contenedor-footer"></footer>
        </div>
    </div>

    <!-- Modal Nuevo Cobro -->
    <div class="modal fade" id="modalNuevoCobro" tabindex="-1" aria-labelledby="modalNuevoCobroLabel" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog">
            <form id="formNuevoCobro" class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="modalNuevoCobroLabel"><i class="bi bi-cash"></i> Registrar Cobro</h5>
                </div>
                <div class="modal-body">
                    <div class="mb-2">
                        <label class="form-label">Cuenta por Cobrar (Pendientes)</label>
                        <select id="account_receivable_id" class="form-select" onchange="onchangeCuenta()" required></select>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Saldo Pendiente</label>
                        <input type="text" id="saldo_pendiente" class="form-control" readonly>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Monto a Cobrar</label>
                        <input type="number" id="monto" class="form-control" required min="1">
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Método de Pago</label>
                        <select id="metodo" class="form-select" required>
                            <option value="">Seleccione...</option>
                            <option value="Efectivo">Efectivo</option>
                            <option value="Transferencia Bancaria">Transferencia Bancaria</option>
                            <option value="Tarjeta de Crédito">Tarjeta de Crédito</option>
                            <option value="Tarjeta de Débito">Tarjeta de Débito</option>
                            <option value="Cheque">Cheque</option>
                        </select>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Nro. Factura / Comprobante</label>
                        <input type="text" id="factura" class="form-control" maxlength="50" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="reset" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cancelar</button>
                    <button type="button" class="btn btn-success" onclick="btnGuardarCobro()"><i class="bi bi-floppy"></i> Guardar Cobro</button>
                </div>
            </form>
        </div>
    </div>

    <script src="menu/scripts.js"></script>
    <script src="bt/bootstrap.bundle.min.js"></script>
    <script src="alert/alertify.min.js"></script>
    <!-- DATATABLES -->
    <script src="dt/jquery-3.7.1.js"></script>
    <script src="dt/datatables.min.js"></script>
    <script src="dt/jquery.dataTables.min.js"></script>
    <script src="dt/es-ES.js"></script>
    <!-- DATATABLES Buttons extension -->
    <script src="dt/dataTables.buttons.min.js"></script>
    <script src="dt/buttons.print.min.js"></script>
    <script src="dt/buttons.html5.min.js"></script>
    <!-- DATATABLES JSZip y pdfmake para exportar -->
    <script src="dt/jszip.min.js"></script>
    <script src="dt/pdfmake.min.js"></script>
    <script src="dt/vfs_fonts.js"></script>
    <!-- SCRIPTS -->
    <script src="js/bd.js"></script>
    <script src="js/alertas.js"></script>
    <script src="js/tablas.js"></script>
    <script src="js/cobros.js"></script>
</body>
</html>
