        <div class="modal-content">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title"><i class="bi bi-shield-lock-fill me-2"></i>Cambiar contraseña</h5>

            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Contraseña actual</label>
                    <input type="password" id="passActual" class="form-control" placeholder="Ingrese su contraseña actual">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nueva contraseña</label>
                    <input type="password" id="passNueva" class="form-control" placeholder="Mín. 6 caracteres">
                </div>

                    <label class="form-label fw-semibold">Confirmar nueva contraseña</label>

                    <i class="bi bi-x-circle"></i> Cancelar

                    <i class="bi bi-floppy"></i> Guardar
                </button>
            </div>
        </div>
    </div>
</div>

<script>
// ── Cargar datos del usuario ─────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function () {
    cargarDatosNavbar();
});

function cargarDatosNavbar() {
    let nombre  = localStorage.getItem('nomUsuario')    || '';
    let usuario = localStorage.getItem('usuarioActivo') || '';

    // Leer sesion del login del compañero si no hay nomUsuario
    if (!nombre) {
        try {
            const sesion   = JSON.parse(localStorage.getItem('sesion'));
            const usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
            if (sesion && sesion.user_id) {
                const u = usuarios.find(x => x.id === sesion.user_id);
                if (u) {
                    nombre  = u.name     || '';
                    usuario = u.username || '';
                }
            }
        } catch(e) {}
    }

    const inicial = nombre.charAt(0).toUpperCase() || '?';

    const a1 = document.getElementById('navAvatar');
    const a2 = document.getElementById('ddAvatar');
    if (a1) a1.textContent = inicial;
    if (a2) a2.textContent = inicial;

    const ddNombre  = document.getElementById('ddNombre');
    const ddUsuario = document.getElementById('ddUsuario');
    if (ddNombre)  ddNombre.textContent  = nombre;
    if (ddUsuario) ddUsuario.textContent = usuario ? '@' + usuario : '';
}

// ── Abrir Configuración: pre-llenar datos ────────────────────────────────────
document.addEventListener('show.bs.modal', function (e) {
    if (e.target.id === 'modalConfiguracion') {
        const usuario  = localStorage.getItem('usuarioActivo') || '';
        const usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
        const u = usuarios.find(x => x.usuario === usuario);
        if (u) {
            document.getElementById('cfgNombre').value  = u.nombre  || '';
            document.getElementById('cfgUsuario').value = u.usuario || '';
            document.getElementById('cfgCelular').value = u.celular || '';
        }
    }
    if (e.target.id === 'modalCambiarContrasena') {
        ['passActual','passNueva','passConfirmar'].forEach(id => {
            document.getElementById(id).value = '';
        });
    }
});

// ── Guardar Configuración ────────────────────────────────────────────────────
function guardarConfiguracion() {
    const usuarioActivo = localStorage.getItem('usuarioActivo') || '';
    const nuevoNombre   = document.getElementById('cfgNombre').value.trim().toUpperCase();
    const nuevoUsuario  = document.getElementById('cfgUsuario').value.trim();
    const nuevoCelular  = document.getElementById('cfgCelular').value.trim();

    if (!nuevoNombre || !nuevoUsuario) {
        alertify.error('El nombre y usuario son obligatorios.');
        return;
    }

    let usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
    const idx = usuarios.findIndex(x => x.usuario === usuarioActivo);
    if (idx !== -1) {
        usuarios[idx].nombre  = nuevoNombre;
        usuarios[idx].usuario = nuevoUsuario;
        usuarios[idx].celular = nuevoCelular;
        localStorage.setItem('usuarios', JSON.stringify(usuarios));
        localStorage.setItem('nomUsuario',    nuevoNombre);
        localStorage.setItem('usuarioActivo', nuevoUsuario);
        cargarDatosNavbar();
        bootstrap.Modal.getInstance(document.getElementById('modalConfiguracion')).hide();
        alertify.success('Configuración guardada correctamente.');
    } else {
        alertify.error('No se encontró el usuario activo.');
    }
}

// ── Cambiar Contraseña ───────────────────────────────────────────────────────
function cambiarContrasena() {
    const usuarioActivo = localStorage.getItem('usuarioActivo') || '';
    const actual    = document.getElementById('passActual').value;
    const nueva     = document.getElementById('passNueva').value;
    const confirmar = document.getElementById('passConfirmar').value;

    if (!actual || !nueva || !confirmar) {
        alertify.error('Completá todos los campos.');
        return;
    }
    if (nueva.length < 6) {
        alertify.error('La nueva contraseña debe tener mínimo 6 caracteres.');
        return;
    }
    if (nueva !== confirmar) {
        alertify.error('Las contraseñas no coinciden.');
        return;
    }

    let usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
    const idx = usuarios.findIndex(x => x.usuario === usuarioActivo);
    if (idx === -1) { alertify.error('Usuario no encontrado.'); return; }

    if (usuarios[idx].contrasena !== actual) {
        alertify.error('La contraseña actual es incorrecta.');
        return;
    }

    usuarios[idx].contrasena = nueva;
    localStorage.setItem('usuarios', JSON.stringify(usuarios));
    bootstrap.Modal.getInstance(document.getElementById('modalCambiarContrasena')).hide();
    alertify.success('Contraseña cambiada correctamente.');
}

// ── Cerrar Sesión ────────────────────────────────────────────────────────────
function cerrarSesion() {
    alertify.confirm('Vanguardia', '¿Deseas cerrar la sesión?',
        function () {
            localStorage.removeItem('nomUsuario');
            localStorage.removeItem('usuarioActivo');
            window.location.href = 'login.html';
        },
        function () {}
    ).set('labels', { ok: 'Sí, salir', cancel: 'No' }).set('transition', 'slide');
}
</script>
