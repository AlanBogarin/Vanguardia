<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Vanguardia - Cuentas por Cobrar</title>
    <link rel="icon" href="img/logo_x16.jpg">
    <!-- ESTILOS DEL MENU -->
    <link href="menu/styles.css" rel="stylesheet"/>
    <!-- BOOTSTRAP -->
    <link rel="stylesheet" href="bt/bootstrap.min.css">
    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="bt-icons/bootstrap-icons.min.css">
    <!-- ALERTIFY -->
    <link rel="stylesheet" href="alert/alertify.min.css">
    <link rel="stylesheet" href="alert/themes/default.min.css">
    <!-- DATATABLES -->
    <link rel="stylesheet" href="dt/datatables.min.css">
    <link rel="stylesheet" href="dt/jquery.dataTables.min.css">
    <link rel="stylesheet" href="dt/buttons.dataTables.min.css">
    <!-- TEMA VANGUARDIA -->
    <link rel="stylesheet" href="css/vanguardia.css">
</head>
<body class="sb-nav-fixed">
    <div id="contenedor-navbar"></div>
    <div id="layoutSidenav">
        <div id="contenedor-sidebar"></div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <div class="d-flex justify-content-between align-items-center mt-2 mb-2">
                        <h1 class="mb-0">Cuentas por Cobrar</h1>
                        <a href="cobros.html" class="btn btn-sm btn-success">
                            <i class="bi bi-cash-stack me-1" id="link-cobros"></i> Ver Cobros
                        </a>
                    </div>

                    <!-- PANEL DE FILTROS -->
                    <div class="row mb-3">
                        <div class="col-12">
                            <div class="card"
                                style="background:rgba(255,255,255,0.65);
                                        border:1px solid rgba(100,160,255,0.3);
                                        box-shadow:0 8px 32px rgba(30,80,180,0.12);
                                        border-radius:12px;
                                        backdrop-filter:blur(6px);">
                                <!-- HEADER CLICKABLE -->
                                <div class="card-header py-2 px-3 d-flex justify-content-between align-items-center"
                                    style="background:rgba(30,80,180,0.9);
                                            color:white;
                                            border-radius:11px 11px 0 0;
                                            cursor:pointer;"
                                    data-bs-toggle="collapse"
                                    data-bs-target="#panelFiltrosCuentasCobrar"
                                    aria-expanded="true">
                                    <span>
                                        <i class="bi bi-funnel-fill me-1"></i>
                                        <strong>Filtros</strong>
                                    </span>
                                    <i class="bi bi-chevron-down"></i>
                                </div>
                                <!-- COLLAPSE BODY -->
                                <div class="collapse show" id="panelFiltrosCuentasCobrar">
                                    <div class="card-body py-3">
                                        <div class="row g-3 align-items-end">
                                            <div class="col-md-3 col-sm-6">
                                                <label class="form-label fw-semibold small mb-1">Estado</label>
                                                <select id="filtro_estado"
                                                        class="form-select form-select-sm">
                                                    <option value="">TODOS</option>
                                                    <option value="PENDIENTE">PENDIENTE</option>
                                                    <option value="PARCIAL">PARCIAL</option>
                                                    <option value="COBRADA">COBRADA</option>
                                                </select>
                                            </div>
                                            <div class="col-md-2 col-sm-6">
                                                <label class="form-label fw-semibold small mb-1">Venc. Desde</label>
                                                <input type="date"
                                                    id="filtro_fecha_desde"
                                                    class="form-control form-control-sm">
                                            </div>
                                            <div class="col-md-2 col-sm-6">
                                                <label class="form-label fw-semibold small mb-1">Venc. Hasta</label>
                                                <input type="date"
                                                    id="filtro_fecha_hasta"
                                                    class="form-control form-control-sm">
                                            </div>
                                            <div class="col-md-3 col-sm-6">
                                                <label class="form-label fw-semibold small mb-1">Cliente</label>
                                                <input type="text"
                                                    id="filtro_cliente"
                                                    class="form-control form-control-sm"
                                                    list="datalist_clientes"
                                                    placeholder="Buscar cliente...">
                                                <datalist id="datalist_clientes"></datalist>
                                            </div>
                                            <div class="col-md-2 col-sm-6">
                                                <div class="d-flex gap-1">
                                                    <button class="btn btn-sm btn-primary flex-fill"
                                                            onclick="onClickFiltrar()">
                                                        <i class="bi bi-funnel"></i> Filtrar
                                                    </button>
                                                    <button class="btn btn-sm btn-outline-secondary flex-fill"
                                                            onclick="onClickLimpiarFiltros()">
                                                        <i class="bi bi-x-circle"></i> Limpiar
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TABLA -->
                    <div class="row">
                        <table id="tabla_cuentas_cobrar" class="display compact" style="width:100%">
                        </table>
                    </div>
                </div>
            </main>
            <footer class="py-4 bg-light mt-auto" id="contenedor-footer"></footer>
        </div>
    </div>

    <!-- Modal Detalle Cuenta (Informativo) -->
    <div class="modal fade" id="modalDetalleCuenta" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-info text-dark">
                    <h5 class="modal-title"><i class="bi bi-info-circle"></i> Detalle de la Cuenta</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <ul class="list-group mb-3">
                        <li class="list-group-item"><strong>Cliente:</strong> <span id="det_cliente"></span></li>
                        <li class="list-group-item"><strong>RUC/Cédula:</strong> <span id="det_ruc"></span></li>
                        <li class="list-group-item"><strong>ID Venta:</strong> <span id="det_venta"></span></li>
                        <li class="list-group-item"><strong>Fecha Emisión:</strong> <span id="det_emision"></span></li>
                        <li class="list-group-item"><strong>Vencimiento:</strong> <span id="det_vencimiento"></span></li>
                    </ul>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MENU -->
    <script src="menu/scripts.js"></script>
    <!-- BOOTSTRAP -->
    <script src="bt/bootstrap.bundle.min.js"></script>
    <!-- ALERTIFY -->
    <script src="alert/alertify.min.js"></script>
    <!-- DATATABLES -->
    <script src="dt/jquery-3.7.1.js"></script>
    <script src="dt/datatables.min.js"></script>
    <script src="dt/jquery.dataTables.min.js"></script>
    <script src="dt/es-ES.js"></script>
    <!-- DATATABLES Buttons extension -->
    <script src="dt/dataTables.buttons.min.js"></script>
    <script src="dt/buttons.print.min.js"></script>
    <script src="dt/buttons.html5.min.js"></script>
    <!-- DATATABLES JSZip y pdfmake para exportar -->
    <script src="dt/jszip.min.js"></script>
    <script src="dt/pdfmake.min.js"></script>
    <script src="dt/vfs_fonts.js"></script>
    <!-- SCRIPTS -->
    <script src="js/bd.js"></script>
    <script src="js/alertas.js"></script>
    <script src="js/tablas.js"></script>
    <script src="js/cuentasporcobrar.js"></script>
</body>
</html>
