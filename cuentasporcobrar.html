<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Vanguardia - Cuentas por Cobrar</title>
    <link rel="icon" href="img/logo_x16.jpg">
    <!-- ESTILOS DEL MENU -->
    <link href="menu/styles.css" rel="stylesheet"/>
    <!-- BOOTSTRAP -->
    <link rel="stylesheet" href="bt/bootstrap.min.css">
    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="bt-icons/bootstrap-icons.min.css">
    <!-- ALERTIFY -->
    <link rel="stylesheet" href="alert/alertify.min.css">
    <link rel="stylesheet" href="alert/themes/default.min.css">
    <!-- DATATABLES -->
    <link rel="stylesheet" href="dt/datatables.min.css">
    <link rel="stylesheet" href="dt/jquery.dataTables.min.css">
    <link rel="stylesheet" href="dt/buttons.dataTables.min.css">
    <!-- TEMA VANGUARDIA -->
    <link rel="stylesheet" href="css/vanguardia.css">
</head>
<body class="sb-nav-fixed">
    <div id="contenedor-navbar"></div>
    <div id="layoutSidenav">
        <div id="contenedor-sidebar"></div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <div class="d-flex justify-content-between align-items-center mt-2 mb-2">
                        <h1 class="mb-0">Cuentas por Cobrar</h1>
                        <a href="cobros.html" class="btn btn-sm btn-success">
                            <i class="bi bi-cash-stack me-1" id="link-cobros"></i> Ver Cobros
                        </a>
                    </div>

                    <!-- PANEL DE FILTROS -->
                    <div class="row mb-3">
                        <div class="col-12">
                            <div class="card"
                                style="background:rgba(255,255,255,0.65);
                                        border:1px solid rgba(100,160,255,0.3);
                                        box-shadow:0 8px 32px rgba(30,80,180,0.12);
                                        border-radius:12px;
                                        backdrop-filter:blur(6px);">
                                <!-- HEADER CLICKABLE -->
                                <div class="card-header py-2 px-3 d-flex justify-content-between align-items-center"
                                    style="background:rgba(30,80,180,0.9);
                                            color:white;
                                            border-radius:11px 11px 0 0;
                                            cursor:pointer;"
                                    data-bs-toggle="collapse"
                                    data-bs-target="#panelFiltrosCuentasCobrar"
                                    aria-expanded="true">
                                    <span>
                                        <i class="bi bi-funnel-fill me-1"></i>
                                        <strong>Filtros</strong>
                                    </span>
                                    <i class="bi bi-chevron-down"></i>
                                </div>
                                <!-- COLLAPSE BODY -->
                                <div class="collapse show" id="panelFiltrosCuentasCobrar">
                                    <div class="card-body py-3">
                                        <div class="row g-3 align-items-end">
                                            <div class="col-md-3 col-sm-6">
                                                <label class="form-label fw-semibold small mb-1">Estado</label>
                                                <select id="filtro_estado"
                                                        class="form-select form-select-sm">
                                                    <option value="">TODOS</option>
                                                    <option value="PENDIENTE">PENDIENTE</option>
                                                    <option value="PARCIAL">PARCIAL</option>
                                                    <option value="COBRADA">COBRADA</option>
                                                </select>
                                            </div>
                                            <div class="col-md-2 col-sm-6">
                                                <label class="form-label fw-semibold small mb-1">Venc. Desde</label>
                                                <input type="date"
                                                    id="filtro_fecha_desde"
                                                    class="form-control form-control-sm">
                                            </div>
                                            <div class="col-md-2 col-sm-6">
                                                <label class="form-label fw-semibold small mb-1">Venc. Hasta</label>
                                                <input type="date"
                                                    id="filtro_fecha_hasta"
                                                    class="form-control form-control-sm">
                                            </div>
                                            <div class="col-md-3 col-sm-6">
                                                <label class="form-label fw-semibold small mb-1">Cliente</label>
                                                <input type="text"
                                                    id="filtro_cliente"
                                                    class="form-control form-control-sm"
                                                    list="datalist_clientes"
                                                    placeholder="Buscar cliente...">
                                                <datalist id="datalist_clientes"></datalist>
                                            </div>

                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TABLA -->
                    <div class="row">
                        <table id="tabla_cuentas_cobrar" class="display compact" style="width:100%">
                        </table>
                    </div>
                </div>
            </main>
            <footer class="py-4 bg-light mt-auto" id="contenedor-footer"></footer>
        </div>
    </div>

    <!-- Modal Detalle Cuenta -->
    <div class="modal fade" id="modalDetalleCuenta" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header" style="background:rgba(30,80,180,0.9); color:white;">
                    <h5 class="modal-title"><i class="bi bi-receipt me-2"></i> Detalle de Cuotas de la Cuenta</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- Info de la cuenta -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <ul class="list-group list-group-flush small">
                                <li class="list-group-item d-flex justify-content-between px-0">
                                    <span class="text-muted">Cliente</span>
                                    <strong id="detalle_cliente">—</strong>
                                </li>
                                <li class="list-group-item d-flex justify-content-between px-0">
                                    <span class="text-muted">ID Venta</span>
                                    <strong id="detalle_venta">—</strong>
                                </li>
                                <li class="list-group-item d-flex justify-content-between px-0">
                                    <span class="text-muted">Fecha Creación</span>
                                    <strong id="detalle_emision">—</strong>
                                </li>
                            </ul>
                        </div>
                        <div class="col-md-6">
                            <ul class="list-group list-group-flush small">
                                <li class="list-group-item d-flex justify-content-between px-0">
                                    <span class="text-muted">Total a Cobrar</span>
                                    <strong id="detalle_total" class="text-primary">—</strong>
                                </li>
                                <li class="list-group-item d-flex justify-content-between px-0">
                                    <span class="text-muted">Total Cobrado</span>
                                    <strong id="detalle_abonado" class="text-success">—</strong>
                                </li>
                                <li class="list-group-item d-flex justify-content-between px-0">
                                    <span class="text-muted">Saldo Pendiente</span>
                                    <strong id="detalle_saldo" class="text-danger">—</strong>
                                </li>
                                <li class="list-group-item d-flex justify-content-between px-0">
                                    <span class="text-muted">Estado Cuenta</span>
                                    <span id="detalle_estado_cuenta">—</span>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <!-- Tabla de cuotas -->
                    <h6 class="fw-bold mb-2"><i class="bi bi-list-ol me-1"></i> Cuotas</h6>
                    <div class="table-responsive">
                        <table class="table table-sm table-bordered align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th class="text-center">#</th>
                                    <th>Importe</th>
                                    <th>Cobrado</th>
                                    <th>Saldo</th>
                                    <th>Vencimiento</th>
                                    <th class="text-center">Estado</th>
                                </tr>
                            </thead>
                            <tbody id="tbody_detalle_cuotas">
                                <tr><td colspan="6" class="text-center text-muted">Sin cuotas</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <a id="btn_cobrar_cuenta" href="#" class="btn btn-success">
                        <i class="bi bi-cash me-1"></i> Ir a Cobrar
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- MENU -->
    <script src="menu/scripts.js"></script>
    <!-- BOOTSTRAP -->
    <script src="bt/bootstrap.bundle.min.js"></script>
    <!-- ALERTIFY -->
    <script src="alert/alertify.min.js"></script>
    <!-- DATATABLES -->
    <script src="dt/jquery-3.7.1.js"></script>
    <script src="dt/datatables.min.js"></script>
    <script src="dt/jquery.dataTables.min.js"></script>
    <script src="dt/es-ES.js"></script>
    <!-- DATATABLES Buttons extension -->
    <script src="dt/dataTables.buttons.min.js"></script>
    <script src="dt/buttons.print.min.js"></script>
    <script src="dt/buttons.html5.min.js"></script>
    <!-- DATATABLES JSZip y pdfmake para exportar -->
    <script src="dt/jszip.min.js"></script>
    <script src="dt/pdfmake.min.js"></script>
    <script src="dt/vfs_fonts.js"></script>
    <!-- SCRIPTS -->
    <script src="js/bd.js"></script>
    <script src="js/alertas.js"></script>
    <script src="js/tablas.js"></script>
    <script src="js/cuentasporcobrar.js"></script>
</body>
</html>
