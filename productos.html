<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Vanguardia - Productos</title>
    <link rel="icon" type="image/png" href="img/logo_x16.jpg">

    <link href="menu/styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="bt-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="dt/datatables.min.css">
    <link rel="stylesheet" href="alert/alertify.min.css">
    <link rel="stylesheet" href="alert/themes/default.min.css">
    <link rel="stylesheet" href="css/vanguardia.css">
</head>
<body class="sb-nav-fixed">
    <div id="contenedor-navbar">
        <!-- ========================================================= -->
        <!-- 1. CONTENEDOR DINÁMICO PARA LA BARRA SUPERIOR (NAVBAR)    -->
        <!-- Este div vacío será llenado por JavaScript usando fetch() -->
        <!-- con el contenido del archivo 'navbar.html'.               -->
        <!-- ========================================================= -->
    </div>
    <div id="layoutSidenav">
        <div id="contenedor-sidebar">
            <!-- ========================================================= -->
            <!-- 2. CONTENEDOR DINÁMICO PARA EL MENÚ LATERAL (SIDEBAR)     -->
            <!-- Este div vacío será llenado por JavaScript usando fetch() -->
            <!-- con el contenido del archivo 'sidebar.html'.              -->
            <!-- ========================================================= -->
        </div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <!-- BOTON NUEVO PRODUCTO -->
                    <div class="d-flex justify-content-between align-items-center mt-2 mb-2">
                        <h1 class="mb-0">Productos</h1>
                        <button class="btn btn-sm btn-primary" id="btnModalNuevo" type="button" onclick="ventanaNuevoProducto()">
                            <i class="bi bi-plus-circle me-1"></i> Nuevo Producto
                        </button>
                    </div>
                    <!-- ESTADISTICAS -->
                    <div class="row mt-3">
                        <div class="col-xl-3 col-md-6">
                            <div class="card bg-primary text-white mb-4">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span>Total Productos</span>
                                        <h3 id="statTotal">0</h3>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-xl-3 col-md-6">
                            <div class="card bg-success text-white mb-4">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span>Productos Activos</span>
                                        <h3 id="statActivos">0</h3>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- TABLA Y FILTROS -->
                    <div class="row mb-3">
                        <div class="col-12">
                            <div class="card" style="background:rgba(255,255,255,0.65);border:1px solid rgba(100,160,255,0.3);box-shadow:0 8px 32px rgba(30,80,180,0.12);border-radius:12px;backdrop-filter:blur(6px);">
                                <div class="card-header py-2 px-3" style="background:rgba(30,80,180,0.9);color:white;border-radius:11px 11px 0 0;">
                                    <i class="bi bi-funnel-fill me-1"></i><strong>Filtros</strong>
                                </div>
                                <div class="card-body py-3">
                                    <div class="row g-3 align-items-end">
                                        <div class="col-md-3 col-sm-6">
                                            <label for="filtro_estado" class="form-label fw-semibold small mb-1" style="color:#0d2149">Estado</label>
                                            <select id="filtro_estado" class="form-select form-select-sm" onchange="cargarDatos()" style="background-color:rgba(255,255,255,0.9);border:1px solid rgba(30,80,180,0.3);color:#0d2149;border-radius:6px;">
                                                <option value="ACTIVO">Activos</option>
                                                <option value="INACTIVO">Inactivos</option>
                                                <option value="" selected>Todos</option>
                                            </select>
                                        </div>
                                        <div class="col-md-3 col-sm-6">
                                            <label for="filtro_categoria" class="form-label fw-semibold small mb-1" style="color:#0d2149">Categoría</label>
                                            <select id="filtro_categoria" class="form-select form-select-sm" onchange="cargarDatos()" style="background-color:rgba(255,255,255,0.9);border:1px solid rgba(30,80,180,0.3);color:#0d2149;border-radius:6px;">
                                                <option value="">Todas</option>
                                            </select>
                                        </div>
                                        <div class="col-md-3 col-sm-6">
                                            <label for="filtro_marca" class="form-label fw-semibold small mb-1" style="color:#0d2149">Marca</label>
                                            <select id="filtro_marca" class="form-select form-select-sm" onchange="cargarDatos()" style="background-color:rgba(255,255,255,0.9);border:1px solid rgba(30,80,180,0.3);color:#0d2149;border-radius:6px;">
                                                <option value="">Todas</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <table id="tabla_productos" class="table table-striped table-bordered" style="width:100%">
                        </table>
                    </div>
                </div>
            </main>
            <footer class="py-4 bg-light mt-auto" id="contenedor-footer">
                <!-- ========================================================= -->
                <!-- 3. CONTENEDOR DINÁMICO PARA EL PIE DE PAGINA (FOOTER)     -->
                <!-- Este div vacío será llenado por JavaScript usando fetch() -->
                <!-- con el contenido del archivo 'footer.html'.               -->
                <!-- ========================================================= -->
            </footer>
        </div>
    </div>

    <!-- Modal Nuevo Producto -->
    <div class="modal fade" id="modalNuevoProducto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <form class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Registrar Nuevo Producto</h5>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Código de Barra</label>
                            <input type="text" id="new_code" class="form-control" required>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label">Nombre</label>
                            <input type="text" id="new_name" class="form-control" required>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label">Descripcion</label>
                            <input type="text" id="new_description" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Precio Compra</label>
                            <input type="number" id="new_purchase_price" class="form-control" min="0" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Precio Venta</label>
                            <input type="number" id="new_selling_price" class="form-control" min="0" required>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Stock</label>
                            <input type="number" id="new_stock" class="form-control" min="0" value="0" disabled>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Min. Stock</label>
                            <input type="number" id="new_min_stock" class="form-control" min="0" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Categoría</label>
                            <select id="new_category_id" class="form-select">
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Marca</label>
                            <select id="new_brand_id" class="form-select">
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">IVA</label>
                            <select id="new_iva" class="form-select">
                                <option value="10">10%</option>
                                <option value="5">5%</option>
                                <option value="0">Exenta</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="reset" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary" type="button" onclick="btnGuardarProducto()">Guardar Producto</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Editar Producto -->
    <div class="modal fade" id="modalEditarProducto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <form class="modal-content">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title">Editar Producto</h5>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="edit_id">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Código de Barra</label>
                            <input type="text" id="edit_code" class="form-control" required>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label">Nombre</label>
                            <input type="text" id="edit_name" class="form-control" required>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label">Descripcion</label>
                            <input type="text" id="edit_description" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Precio Compra</label>
                            <input type="number" id="edit_purchase_price" class="form-control" min="0" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Precio Venta</label>
                            <input type="number" id="edit_selling_price" class="form-control" min="0" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Stock Actual</label>
                            <input type="number" id="edit_stock" class="form-control" min="0" disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Stock Mínimo</label>
                            <input type="number" id="edit_min_stock" class="form-control" min="0" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Categoría</label>
                            <select id="edit_category_id" class="form-select"></select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Marca</label>
                            <select id="edit_brand_id" class="form-select"></select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">IVA</label>
                            <select id="edit_iva" class="form-select">
                                <option value="10">10%</option>
                                <option value="5">5%</option>
                                <option value="0">Exenta</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="reset" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-warning" type="button" onclick="btnEditarProducto()">Actualizar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Eliminar Producto -->
    <div class="modal fade" id="modalEliminarProducto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <form class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Confirmar Eliminación</h5>
                </div>
                <div class="modal-body">
                    <p class="text-center fw-bold">¿Está seguro de que desea eliminar este producto? Esta acción no se
                        puede deshacer.</p>
                    <input type="hidden" id="del_id">
                    <ul class="list-group mb-3">
                        <li class="list-group-item"><strong>Nombre:</strong> <span id="del_name"></span></li>
                        <li class="list-group-item"><strong>Descripción:</strong> <span id="del_description"></span>
                        </li>
                        <li class="list-group-item"><strong>Marca:</strong> <span id="del_brand"></span></li>
                        <li class="list-group-item"><strong>IVA:</strong> <span id="del_iva"></span></li>
                    </ul>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="reset" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-danger" type="button" onclick="btnEliminarProducto()">Eliminar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MENU -->
    <script src="menu/scripts.js"></script>
    <!-- BOOTSTRAP -->
    <script src="bt/bootstrap.bundle.min.js"></script>
    <!-- ALERTIFY -->
    <script src="alert/alertify.min.js"></script>
    <!-- DATATABLES -->
    <script src="dt/jquery-3.7.1.js"></script>
    <script src="dt/datatables.min.js"></script>
    <script src="dt/jquery.dataTables.min.js"></script>
    <script src="dt/es-ES.js"></script>
    <!-- DATATABLES Buttons extension -->
    <script src="dt/dataTables.buttons.min.js"></script>
    <script src="dt/buttons.print.min.js"></script>
    <script src="dt/buttons.html5.min.js"></script>
    <!-- DATATABLES JSZip y pdfmake para exportar -->
    <script src="dt/jszip.min.js"></script>
    <script src="dt/pdfmake.min.js"></script>
    <script src="dt/vfs_fonts.js"></script>
    <!-- SCRIPTS -->
    <script src="js/bd.js"></script>
    <script src="js/alertas.js"></script>
    <script src="js/tablas.js"></script>
    <script src="js/productos.js"></script>
</body>
</html>
