<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Vanguardia - Productos</title>
    <link rel="icon" type="image/png" href="img/working.png">

    <link href="menu/styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="bt-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="dt/datatables.min.css">
    <link rel="stylesheet" href="alert/alertify.min.css">
    <link rel="stylesheet" href="alert/themes/default.min.css">
    <link rel="stylesheet" href="css/vanguardia.css">
</head>
<body class="sb-nav-fixed">
    <!-- <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
        <a class="navbar-brand ps-3" href="menu.html">Vanguardia</a>
    </nav> -->
    <div id="contenedor-navbar">
        <!-- ========================================================= -->
        <!-- 1. CONTENEDOR DINÁMICO PARA LA BARRA SUPERIOR (NAVBAR)    -->
        <!-- Este div vacío será llenado por JavaScript usando fetch() -->
        <!-- con el contenido del archivo 'navbar.html'.               -->
        <!-- ========================================================= -->
    </div>
    <div id="layoutSidenav">
        <div id="contenedor-sidebar">
            <!-- ========================================================= -->
            <!-- 2. CONTENEDOR DINÁMICO PARA EL MENÚ LATERAL (SIDEBAR)     -->
            <!-- Este div vacío será llenado por JavaScript usando fetch() -->
            <!-- con el contenido del archivo 'sidebar.html'.              -->
            <!-- ========================================================= -->
        </div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4">Gestión de Productos</h1>
                    
                    <div class="row mb-4 mt-3">
                        <div class="col-xl-3 col-md-6">
                            <div class="card bg-primary text-white mb-4">
                               <div class="card-body">
                                   <div class="d-flex justify-content-between align-items-center">
                                       <span>Total Productos</span>
                                       <h3 id="statTotal">0</h3>
                                   </div>
                               </div>
                            </div>
                        </div>
                        <div class="col-xl-3 col-md-6">
                            <div class="card bg-success text-white mb-4">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span>Productos Activos</span>
                                        <h3 id="statActivos">0</h3>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card mb-4">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <div><i class="bi bi-table me-1"></i> Lista de Inventario</div>
                            <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modalNuevoProducto">
                                <i class="bi bi-plus-circle"></i> Nuevo Producto
                            </button>
                        </div>
                        <div class="card-body">
                            <table id="tabla_productos" class="table table-striped table-bordered" style="width:100%">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Código</th>
                                        <th>Producto</th>
                                        <th>Precio Venta</th>
                                        <th>Stock</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
            <footer class="py-4 bg-light mt-auto" id="contenedor-footer">
                <!-- ========================================================= -->
                <!-- 3. CONTENEDOR DINÁMICO PARA EL PIE DE PAGINA (FOOTER)     -->
                <!-- Este div vacío será llenado por JavaScript usando fetch() -->
                <!-- con el contenido del archivo 'footer.html'.               -->
                <!-- ========================================================= -->
            </footer>
        </div>
    </div>

    <div class="modal fade" id="modalNuevoProducto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Registrar Nuevo Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formNuevoProducto">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Código</label>
                                <input type="text" id="new_code" class="form-control" required>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label">Nombre del Producto</label>
                                <input type="text" id="new_name" class="form-control" required>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label">Descripcion del Producto</label>
                                <input type="text" id="new_description" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Precio Compra</label>
                                <input type="number" id="new_purchase_price" class="form-control" min="0" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Precio Venta</label>
                                <input type="number" id="new_selling_price" class="form-control" min="0" required>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">Stock</label>
                                <input type="number" id="new_stock" class="form-control" min="0" required>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">Min. Stock</label>
                                <input type="number" id="new_min_stock" class="form-control" min="0" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Categoría</label>
                                <select id="new_category_id" class="form-select"></select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Marca</label>
                                <select id="new_brand_id" class="form-select"></select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">IVA</label>
                                <select id="new_iva" class="form-select">
                                    <option value="10">10%</option>
                                    <option value="5">5%</option>
                                    <option value="0">Exenta</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="btnGuardarNuevo" class="btn btn-primary">Guardar Producto</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalEditarProducto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title">Editar Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formEditarProducto">
                        <input type="hidden" id="edit_id">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Código</label>
                                <input type="text" id="edit_code" class="form-control" required>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label">Nombre</label>
                                <input type="text" id="edit_name" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Precio Compra</label>
                                <input type="number" id="edit_purchase_price" class="form-control" min="0" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Precio Venta</label>
                                <input type="number" id="edit_selling_price" class="form-control" min="0" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Stock Actual</label>
                                <input type="number" id="edit_stock" class="form-control" min="0" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Stock Mínimo</label>
                                <input type="number" id="edit_min_stock" class="form-control" min="0" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Categoría</label>
                                <select id="edit_category_id" class="form-select"></select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Marca</label>
                                <select id="edit_brand_id" class="form-select"></select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">IVA</label>
                                <select id="edit_iva" class="form-select">
                                    <option value="10">10%</option>
                                    <option value="5">5%</option>
                                    <option value="0">Exenta</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="btnActualizarProducto" class="btn btn-warning">Actualizar Cambios</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalEliminarProducto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Confirmar Eliminación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    ¿Está seguro de que desea eliminar este producto? Esta acción no se puede deshacer.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="btnConfirmarEliminar" class="btn btn-danger">Eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="menu/scripts.js"></script>
    <!-- BOOTSTRAP -->
    <script src="bt/bootstrap.bundle.min.js"></script>
    <!-- ALERTIFY -->
    <script src="alert/alertify.min.js"></script>
    <!-- DATATABLES -->
    <script src="dt/jquery-3.7.1.js"></script>
    <script src="dt/datatables.min.js"></script>
    <!-- DATATABLES Idioma Español -->
    <script src="dt/es-ES.js"></script>
    <!-- SCRIPTS -->
    <script src="js/bd.js"></script>
    <script src="js/alertas.js"></script>
    <script src="js/productos.js"></script>
</body>
</html>
