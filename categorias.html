
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanguardia - Categorías</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="bt/bootstrap.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="bt-icons/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/categorias.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-tags-fill"></i>
                Sistema Categorías
            </a>
        </div>
    </nav>

    <div class="container mt-4">

        <div class="card shadow">

            <div class="card-header bg-success text-white">
                <h3>
                    <i class="bi bi-tags-fill"></i>
                    Gestión de Categorías
                </h3>
            </div>

            <div class="card-body">

                <!-- FORMULARIO -->
                <div class="row g-3">

                    <div class="col-md-2">
                        <label class="form-label">ID</label>
                        <input class="form-control" type="number" id="txtId">
                    </div>

                    <div class="col-md-5">
                        <label class="form-label">Nombre</label>
                        <input class="form-control" type="text" id="txtCategoria">
                    </div>

                    <div class="col-md-5">
                        <label class="form-label">Descripción</label>
                        <input class="form-control" type="text" id="txtDescripcion">
                    </div>
                </div>


                <!-- BOTONES -->
                <div class="mt-4 d-flex flex-wrap gap-2">

                    <button class="btn btn-primary" onclick="nuevo()">
                        <i class="bi bi-plus-circle"></i>
                        Nuevo
                    </button>

                    <button class="btn btn-success" onclick="guardar()">
                        <i class="bi bi-save"></i>
                        Guardar
                    </button>

                    <button class="btn btn-warning text-white" onclick="modificar()">
                        <i class="bi bi-pencil-square"></i>
                        Modificar
                    </button>

                    <button class="btn btn-danger" onclick="eliminarFila()">
                        <i class="bi bi-trash"></i>
                        Eliminar
                    </button>

                    <button class="btn btn-dark" onclick="vaciarTabla()">
                        <i class="bi bi-x-circle"></i>
                        Vaciar
                    </button>

                    <button class="btn btn-secondary" onclick="window.print()">
                        <i class="bi bi-printer"></i>
                        Imprimir
                    </button>

                    <button class="btn btn-success" onclick="exportarExcel()">
                        <i class="bi bi-file-earmark-excel"></i>
                        Excel
                    </button>

                    <button class="btn btn-danger" onclick="exportarPDF()">
                        <i class="bi bi-file-earmark-pdf"></i>
                        PDF
                    </button>
                </div>


                <!-- TABLA -->
                <div class="table-responsive mt-4">

                    <table class="table table-bordered table-hover" id="tablaCategorias">

                        <thead class="table-dark">
                            <tr>
                                <th>ID Categoría</th>
                                <th>Nombre</th>
                                <th>Descripción</th>
                                <th>Fecha de creación</th>
                                <th>Fecha de modificación</th>
                            </tr>
                        </thead>

                        <tbody>
                        </tbody>

                    </table>
                </div>
            </div>
        </div>
    </div>


    <!-- Bootstrap -->
    <script src="bt/bootstrap.bundle.min.js"></script>

    <!-- Excel -->
    <script src="dt/xlsx.full.min.js"></script>

    <!-- PDF -->
    <script src="dt/jspdf.umd.min.js"></script>
    <script src="dt/jspdf.plugin.autotable.min.js"></script>

    <!-- JS -->
    <script src="js/categorias.js"></script>

</body>
</html>
