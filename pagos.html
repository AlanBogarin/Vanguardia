<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Vanguardia - Pagos</title>
    <link rel="icon" href="img/logo_x16.jpg">
    <!-- ESTILOS DEL MENU -->
    <link href="menu/styles.css" rel="stylesheet"/>
    <!-- BOOTSTRAP -->
    <link rel="stylesheet" href="bt/bootstrap.min.css">
    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="bt-icons/bootstrap-icons.min.css">
    <!-- ALERTIFY -->
    <link rel="stylesheet" href="alert/alertify.min.css">
    <link rel="stylesheet" href="alert/themes/default.min.css">
    <!-- DATATABLES -->
    <link rel="stylesheet" href="dt/datatables.min.css">
    <link rel="stylesheet" href="dt/jquery.dataTables.min.css">
    <link rel="stylesheet" href="dt/buttons.dataTables.min.css">
    <!-- TEMA VANGUARDIA -->
    <link rel="stylesheet" href="css/vanguardia.css">
</head>
<body class="sb-nav-fixed">
    <div id="contenedor-navbar">
        <!-- ========================================================= -->
        <!-- 1. CONTENEDOR DINÁMICO PARA LA BARRA SUPERIOR (NAVBAR)    -->
        <!-- Este div vacío será llenado por JavaScript usando fetch() -->
        <!-- con el contenido del archivo 'navbar.html'.               -->
        <!-- ========================================================= -->
    </div>
    <div id="layoutSidenav">
        <div id="contenedor-sidebar">
            <!-- ========================================================= -->
            <!-- 2. CONTENEDOR DINÁMICO PARA EL MENÚ LATERAL (SIDEBAR)     -->
            <!-- Este div vacío será llenado por JavaScript usando fetch() -->
            <!-- con el contenido del archivo 'sidebar.html'.              -->
            <!-- ========================================================= -->
        </div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <div class="d-flex justify-content-between align-items-center mt-2 mb-2">
                        <h1 class="mb-0">Pagos a Proveedores</h1>
                        <button class="btn btn-sm btn-primary" id="btnModalNuevo" type="button" onclick="ventanaNuevoPago()">
                            <i class="bi bi-cash-coin me-1"></i> Registrar Nuevo Pago
                        </button>
                    </div>

                    <!-- PANEL DE FILTROS -->
                    <div class="row mb-3">
                        <div class="col-12">
                            <div class="card"
                                style="background:rgba(255,255,255,0.65);
                                        border:1px solid rgba(100,160,255,0.3);
                                        box-shadow:0 8px 32px rgba(30,80,180,0.12);
                                        border-radius:12px;
                                        backdrop-filter:blur(6px);">
                                <!-- HEADER CLICKABLE -->
                                <div class="card-header py-2 px-3 d-flex justify-content-between align-items-center"
                                    style="background:rgba(30,80,180,0.9);
                                            color:white;
                                            border-radius:11px 11px 0 0;
                                            cursor:pointer;"
                                    data-bs-toggle="collapse"
                                    data-bs-target="#panelFiltrosPagos"
                                    aria-expanded="true">
                                    <span>
                                        <i class="bi bi-funnel-fill me-1"></i>
                                        <strong>Filtros</strong>
                                    </span>
                                    <i class="bi bi-chevron-down"></i>
                                </div>
                                <!-- COLLAPSE BODY -->
                                <div class="collapse show" id="panelFiltrosPagos">
                                    <div class="card-body py-3">
                                        <div class="row g-3 align-items-end">
                                            <div class="col-md-4 col-sm-6">
                                                <label for="filtro_metodo" class="form-label fw-semibold small mb-1" style="color:#0d2149">
                                                    Método de Pago
                                                </label>
                                                <select id="filtro_metodo"
                                                        class="form-select form-select-sm"
                                                        style="background-color:rgba(255,255,255,0.9);
                                                            border:1px solid rgba(30,80,180,0.3);
                                                            color:#0d2149;
                                                            border-radius:6px;">
                                                    <option value="">Todos</option>
                                                    <option value="EFECTIVO">Efectivo</option>
                                                    <option value="TRANSFERENCIA">Transferencia Bancaria</option>
                                                    <option value="TARJETA_CREDITO">Tarjeta de Crédito</option>
                                                    <option value="TARJETA_DEBITO">Tarjeta de Débito</option>
                                                    <option value="CHEQUE">Cheque</option>
                                                    <option value="CREDITO">Crédito Comercial / Cuenta Corriente</option>
                                                </select>
                                            </div>
                                            <div class="col-md-3 col-sm-6">
                                                <label for="filtro_fecha_desde" class="form-label fw-semibold small mb-1" style="color:#0d2149">
                                                    Desde (Fecha de Creación)
                                                </label>
                                                <input type="date"
                                                    id="filtro_fecha_desde"
                                                    class="form-control form-control-sm"
                                                    style="background-color:rgba(255,255,255,0.9);
                                                            border:1px solid rgba(30,80,180,0.3);
                                                            color:#0d2149;
                                                            border-radius:6px;">
                                            </div>
                                            <div class="col-md-3 col-sm-6">
                                                <label for="filtro_fecha_hasta" class="form-label fw-semibold small mb-1" style="color:#0d2149">
                                                    Hasta (Fecha de Creación)
                                                </label>
                                                <input type="date"
                                                    id="filtro_fecha_hasta"
                                                    class="form-control form-control-sm"
                                                    style="background-color:rgba(255,255,255,0.9);
                                                            border:1px solid rgba(30,80,180,0.3);
                                                            color:#0d2149;
                                                            border-radius:6px;">
                                            </div>
                                            <div class="col-md-2 col-sm-6 d-flex flex-column justify-content-end">
                                                <div class="d-flex gap-1">
                                                    <button class="btn btn-sm btn-primary flex-fill"
                                                            onclick="aplicarFiltros()">
                                                        <i class="bi bi-funnel"></i> Filtrar
                                                    </button>
                                                    <button class="btn btn-sm btn-outline-secondary flex-fill"
                                                            onclick="limpiarFiltros()">
                                                        <i class="bi bi-x-circle"></i> Limpiar
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- METRICAS -->
                    <div class="row mb-3">
                        <div class="col-xl-3 col-md-6">
                            <div class="card shadow-sm text-white" style="background:linear-gradient(135deg, #0d6efd 0%, #0a4ebd 100%);border-radius:12px;border:none;">
                                <div class="card-body py-3 d-flex align-items-center justify-content-between">
                                    <div>
                                        <h6 class="mb-1 text-uppercase fw-semibold small" style="opacity: 0.85; letter-spacing: 0.5px;">Total Pagado (Filtrado)</h6>
                                        <h3 class="mb-0 fw-bold" id="suma_pagos">0 Gs.</h3>
                                    </div>
                                    <div class="d-flex align-items-center justify-content-center" style="width: 48px; height: 48px; background: rgba(255,255,255,0.15); border-radius: 50%;">
                                        <i class="bi bi-cash-coin fs-3"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- TABLA -->
                    <div class="row">
                        <table id="tabla_pagos" class="display compact" style="width:100%">
                        </table>
                    </div>
                </div>
            </main>
            <footer class="py-4 bg-light mt-auto" id="contenedor-footer">
                <!-- ========================================================= -->
                <!-- 3. CONTENEDOR DINÁMICO PARA EL PIE DE PAGINA (FOOTER)     -->
                <!-- Este div vacío será llenado por JavaScript usando fetch() -->
                <!-- con el contenido del archivo 'footer.html'.               -->
                <!-- ========================================================= -->
            </footer>
        </div>
    </div>

    <!-- Modal Nuevo Pago -->
    <div class="modal fade" id="modalNuevoPago" tabindex="-1" aria-labelledby="modalNuevoPagoLabel" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog">
            <form id="formNuevoPago" class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="modalNuevoPagoLabel"><i class="bi bi-cash"></i> Registrar Pago</h5>
                </div>
                <div class="modal-body">
                    <div class="mb-2">
                        <label class="form-label">Cuenta por Pagar (Pendientes)</label>
                        <select id="cuenta_id" class="form-select" onchange="onchangeCuenta()" required></select>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Saldo Pendiente</label>
                        <input type="text" id="saldo_pendiente" class="form-control" readonly>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Monto a Pagar</label>
                        <input type="number" id="monto" class="form-control" min="1" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Método de Pago</label>
                        <select id="metodo" class="form-select" onchange="onchangeMetodoPago()" required>
                            <option value="">Seleccione...</option>
                            <option value="EFECTIVO">Efectivo</option>
                            <option value="TRANSFERENCIA">Transferencia Bancaria</option>
                            <option value="TARJETA_CREDITO">Tarjeta de Crédito</option>
                            <option value="TARJETA_DEBITO">Tarjeta de Débito</option>
                            <option value="CHEQUE">Cheque</option>
                            <!-- <option value="CREDITO">Crédito Comercial / Cuenta Corriente</option> -->
                        </select>
                    </div>
                    <div class="mb-2 d-none" id="div_banco">
                        <label class="form-label">Banco</label>
                        <select id="banco" class="form-select">
                            <option value="">Seleccione Banco...</option>
                            <option value="ITAU">Banco Itaú</option>
                            <option value="CONTINENTAL">Banco Continental</option>
                            <option value="ATLAS">Banco Atlas</option>
                            <option value="GNB">Banco GNB</option>
                            <option value="SUDAMERIS">Banco Sudameris</option>
                            <option value="BASA">Banco Basa</option>
                            <option value="BNF">Banco Nacional de Fomento (BNF)</option>
                            <option value="UENO">Ueno Bank</option>
                            <option value="FAMILIAR">Banco Familiar</option>
                        </select>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Nro. Referencia / Comprobante / Observaciones</label>
                        <input type="text" id="obs" class="form-control" maxlength="50">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="reset" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cancelar</button>
                    <button class="btn btn-success" type="button" onclick="btnGuardarPago()"><i class="bi bi-floppy"></i> Guardar Pago</button>
                </div>
            </form>
        </div>
    </div>

    <script src="menu/scripts.js"></script>
    <script src="bt/bootstrap.bundle.min.js"></script>
    <script src="alert/alertify.min.js"></script>
    <!-- DATATABLES -->
    <script src="dt/jquery-3.7.1.js"></script>
    <script src="dt/datatables.min.js"></script>
    <script src="dt/jquery.dataTables.min.js"></script>
    <script src="dt/es-ES.js"></script>
    <!-- DATATABLES Buttons extension -->
    <script src="dt/dataTables.buttons.min.js"></script>
    <script src="dt/buttons.print.min.js"></script>
    <script src="dt/buttons.html5.min.js"></script>
    <!-- DATATABLES JSZip y pdfmake para exportar -->
    <script src="dt/jszip.min.js"></script>
    <script src="dt/pdfmake.min.js"></script>
    <script src="dt/vfs_fonts.js"></script>
    <!-- SCRIPTS -->
    <script src="js/bd.js"></script>
    <script src="js/alertas.js"></script>
    <script src="js/tablas.js"></script>
    <script src="js/pagos.js"></script>
</body>
</html>
