<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Vanguardia - Usuarios</title>
    <link rel="icon" href="img/logo_x16.jpg">
    <!-- ESTILOS DEL MENU -->
    <link href="menu/styles.css" rel="stylesheet"/>
    <!-- BOOTSTRAP -->
    <link rel="stylesheet" href="bt/bootstrap.min.css">
    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="bt-icons/bootstrap-icons.min.css">
    <!-- ALERTIFY -->
    <link rel="stylesheet" href="alert/alertify.min.css">
    <link rel="stylesheet" href="alert/themes/default.min.css">
    <!-- DATATABLES -->
    <link rel="stylesheet" href="dt/datatables.min.css">
    <link rel="stylesheet" href="dt/jquery.dataTables.min.css">
    <link rel="stylesheet" href="dt/buttons.dataTables.min.css">
    <!-- TEMA VANGUARDIA -->
    <link rel="stylesheet" href="css/vanguardia.css">
</head>
<body class="sb-nav-fixed">
    <div id="contenedor-navbar">
        <!-- ========================================================= -->
        <!-- 1. CONTENEDOR DINÁMICO PARA LA BARRA SUPERIOR (NAVBAR)    -->
        <!-- Este div vacío será llenado por JavaScript usando fetch() -->
        <!-- con el contenido del archivo 'navbar.html'.               -->
        <!-- ========================================================= -->
    </div>
    <div id="layoutSidenav">
        <div id="contenedor-sidebar">
            <!-- ========================================================= -->
            <!-- 2. CONTENEDOR DINÁMICO PARA EL MENÚ LATERAL (SIDEBAR)     -->
            <!-- Este div vacío será llenado por JavaScript usando fetch() -->
            <!-- con el contenido del archivo 'sidebar.html'.              -->
            <!-- ========================================================= -->
        </div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <div class="d-flex justify-content-between align-items-center mt-2 mb-2">
                        <h1 class="mb-0">Usuarios</h1>
                        <button class="btn btn-sm btn-primary" id="btnModalNuevo" type="button" onclick="ventanaNuevoUsuario()">
                            <i class="bi bi-person-plus-fill me-1"></i> Nuevo Usuario
                        </button>
                    </div>
                    <!-- Filtros -->
                    <div class="row mb-3">
                        <div class="col-12">
                            <div class="card" style="background:rgba(255,255,255,0.65);border:1px solid rgba(100,160,255,0.3);box-shadow:0 8px 32px rgba(30,80,180,0.12);border-radius:12px;backdrop-filter:blur(6px);">
                                <div class="card-header py-2 px-3" style="background:rgba(30,80,180,0.9);color:white;border-radius:11px 11px 0 0;">
                                    <i class="bi bi-funnel-fill me-1"></i><strong>Filtros</strong>
                                </div>
                                <div class="card-body py-3">
                                    <div class="row g-3 align-items-end">
                                        <div class="col-md-3 col-sm-6">
                                            <label for="filtro_estado" class="form-label fw-semibold small mb-1" style="color:#0d2149">Estado</label>
                                            <select id="filtro_estado" class="form-select form-select-sm" onchange="cargarDatos()" style="background-color:rgba(255,255,255,0.9);border:1px solid rgba(30,80,180,0.3);color:#0d2149;border-radius:6px;">
                                                <option value="ACTIVO">Activos</option>
                                                <option value="INACTIVO">Inactivos</option>
                                                <option value="" selected>Todos</option>
                                            </select>
                                        </div>
                                        <div class="col-md-3 col-sm-6">
                                            <label for="filtro_rol" class="form-label fw-semibold small mb-1" style="color:#0d2149">Rol</label>
                                            <select id="filtro_rol" class="form-select form-select-sm" onchange="cargarDatos()" style="background-color:rgba(255,255,255,0.9);border:1px solid rgba(30,80,180,0.3);color:#0d2149;border-radius:6px;">
                                                <option value="">Todos</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <table id="tabla_usuarios" class="display compact" style="width:100%">
                        </table>
                    </div>
                </div>
            </main>
            <footer class="py-4 bg-light mt-auto" id="contenedor-footer">
                <!-- ========================================================= -->
                <!-- 3. CONTENEDOR DINÁMICO PARA EL PIE DE PAGINA (FOOTER)     -->
                <!-- Este div vacío será llenado por JavaScript usando fetch() -->
                <!-- con el contenido del archivo 'footer.html'.               -->
                <!-- ========================================================= -->
            </footer>
        </div>
    </div>

    <!-- Modal Nuevo Usuario -->
    <div class="modal fade" id="modalNuevoUsuario" tabindex="-1" aria-labelledby="modalNuevoUsuarioLabel" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-xl">
            <form class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalNuevoUsuarioLabel"><i class="bi bi-person-plus-fill"></i> Agregar Nuevo Usuario</h5>
                </div>
                <div class="modal-body">
                    <div class="mb-2">
                        <label class="form-label">Usuario</label>
                        <input class="form-control" id="new_username" type="text" minlength="5" maxlength="20" pattern="^[a-zA-Z0-9._\-]{5,20}$" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Contraseña</label>
                        <input class="form-control" id="new_password" type="password" minlength="8" pattern="^(?=.*[a-zA-Z])(?=.*\d)(?=.*[$@$!%*?&._\-])[A-Za-z\d$@$!%*?&._\-]{8,}$" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Confirmar Contraseña</label>
                        <input class="form-control" id="new_password_confirm" type="password" minlength="8" pattern="^(?=.*[a-zA-Z])(?=.*\d)(?=.*[$@$!%*?&._\-])[A-Za-z\d$@$!%*?&._\-]{8,}$" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Nombre Completo</label>
                        <input class="form-control text-uppercase" id="new_name" type="text" minlength="5" maxlength="50" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">RUC/Cédula</label>
                        <input class="form-control text-uppercase" id="new_ruc" type="text" pattern="^\d{5,8}[A-Z]?(-\d)?$" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Teléfono</label>
                        <input class="form-control text-uppercase" id="new_tel" type="text" pattern="^09\d{8}$" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Correo Electrónico</label>
                        <input class="form-control" id="new_email" type="email" pattern="[^\s@]+@[^\s@]+\.[^\s@]{2,}" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Dirección</label>
                        <input class="form-control" id="new_address" type="text" minlength="5" maxlength="50" pattern="^[a-zA-Z0-9ñÑáéíóúÁÉÍÓÚüÜ\s,.:°#/-]{5,50}$" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Rol</label>
                        <select class="form-select" id="new_rol_id" required></select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="reset" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cancelar</button>
                    <button class="btn btn-primary" type="button" onclick="btnNuevoUsuario()"><i class="bi bi-floppy"></i> Guardar Usuario</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Editar Usuario -->
    <div class="modal fade" id="modalEditarUsuario" tabindex="-1" aria-labelledby="modalEditarUsuarioLabel" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-xl">
            <form id="formEditarUsuario" class="modal-content">
                <div class="modal-header bg-warning text-dark">
                    <h5 class="modal-title" id="modalEditarUsuarioLabel"><i class="bi bi-pencil-square"></i> Editar Usuario</h5>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="edit_id">
                    <div class="mb-2">
                        <label class="form-label">Usuario</label>
                        <input class="form-control" id="edit_username" type="text" minlength="5" maxlength="20" pattern="^[a-zA-Z0-9._\-]{5,20}$" readonly>
                    </div>
                    <div class="mb-2">
                        <label class="form-label" >Nueva Contraseña</label>
                        <input class="form-control" id="edit_password" type="text" placeholder="Dejar en blanco para no cambiar" minlength="6">
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Nombre Completo</label>
                        <input class="form-control text-uppercase" id="edit_name" type="text" minlength="5" maxlength="50" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">RUC/Cédula</label>
                        <input class="form-control text-uppercase" id="edit_ruc" type="text" pattern="^\d{5,8}[A-Z]?(-\d)?$" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Teléfono</label>
                        <input class="form-control text-uppercase" id="edit_tel" type="text" pattern="^09\d{8}$" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Correo Electrónico</label>
                        <input class="form-control" id="edit_email" type="email" pattern="[^\s@]+@[^\s@]+\.[^\s@]{2,}" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Dirección</label>
                        <input class="form-control" id="edit_address" type="text" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Rol</label>
                        <select class="form-select" id="edit_rol_id" required></select>
                    </div>
                    <!-- <div class="form-check form-switch mb-2 mt-3">
                        <input class="form-check-input" type="checkbox" id="edit_active">
                        <label class="form-check-label" for="edit_activo">Usuario Activo</label>
                    </div> -->
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="reset" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cancelar</button>
                    <button class="btn btn-warning" type="button" onclick="btnEditarUsuario()"><i class="bi bi-floppy"></i> Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Eliminar Usuario -->
    <div class="modal fade" id="modalEliminarUsuario" tabindex="-1" aria-labelledby="modalEliminarUsuarioLabel" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog">
            <form class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="modalEliminarUsuarioLabel"><i class="bi bi-exclamation-triangle-fill"></i> Eliminar Usuario</h5>
                </div>
                <div class="modal-body">
                    <p class="text-center fw-bold">¿Deseas proceder con la eliminación?</p>
                    <input type="hidden" id="del_id">
                        <ul class="list-group mb-3">
                            <li class="list-group-item"><strong>Usuario:</strong> <span id="del_username"></span></li>
                            <li class="list-group-item"><strong>Nombre:</strong> <span id="del_name"></span></li>
                            <li class="list-group-item"><strong>Correo:</strong> <span id="del_email"></span></li>
                            <li class="list-group-item"><strong>Rol:</strong> <span id="del_rol"></span></li>
                        </ul>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="reset" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Cancelar</button>
                    <button class="btn btn-danger" type="button" onclick="btnEliminarUsuario()"><i class="bi bi-trash"></i> Eliminar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MENU -->
    <script src="menu/scripts.js"></script>
    <!-- BOOTSTRAP -->
    <script src="bt/bootstrap.bundle.min.js"></script>
    <!-- ALERTIFY -->
    <script src="alert/alertify.min.js"></script>
    <!-- DATATABLES -->
    <script src="dt/jquery-3.7.1.js"></script>
    <script src="dt/datatables.min.js"></script>
    <script src="dt/jquery.dataTables.min.js"></script>
    <script src="dt/es-ES.js"></script>
    <!-- DATATABLES Buttons extension -->
    <script src="dt/dataTables.buttons.min.js"></script>
    <script src="dt/buttons.print.min.js"></script>
    <script src="dt/buttons.html5.min.js"></script>
    <!-- DATATABLES JSZip y pdfmake para exportar -->
    <script src="dt/jszip.min.js"></script>
    <script src="dt/pdfmake.min.js"></script>

    <!-- SCRIPTS -->
    <script src="js/bd.js"></script>

    <script src="js/usuarios.js"></script>
</body>
</html>
