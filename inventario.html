<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Vanguardia - Inventario</title>
    <link rel="icon" href="img/logo_x16.jpg">
    <!-- ESTILOS DEL MENU -->
    <link href="menu/styles.css" rel="stylesheet"/>
    <!-- BOOTSTRAP -->
    <link rel="stylesheet" href="bt/bootstrap.min.css">
    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="bt-icons/bootstrap-icons.min.css">
    <!-- ALERTIFY -->
    <link rel="stylesheet" href="alert/alertify.min.css">
    <link rel="stylesheet" href="alert/themes/default.min.css">
    <!-- DATATABLES -->
    <link rel="stylesheet" href="dt/datatables.min.css">
    <link rel="stylesheet" href="dt/jquery.dataTables.min.css">
    <link rel="stylesheet" href="dt/buttons.dataTables.min.css">
    <!-- TEMA VANGUARDIA -->
    <link rel="stylesheet" href="css/vanguardia.css">
</head>
<body class="sb-nav-fixed">
    <div id="contenedor-navbar">
        <!-- ========================================================= -->
        <!-- 1. CONTENEDOR DINÁMICO PARA LA BARRA SUPERIOR (NAVBAR)    -->
        <!-- Este div vacío será llenado por JavaScript usando fetch() -->
        <!-- con el contenido del archivo 'navbar.html'.               -->
        <!-- ========================================================= -->
    </div>
    <div id="layoutSidenav">
        <div id="contenedor-sidebar">
            <!-- ========================================================= -->
            <!-- 2. CONTENEDOR DINÁMICO PARA EL MENÚ LATERAL (SIDEBAR)     -->
            <!-- Este div vacío será llenado por JavaScript usando fetch() -->
            <!-- con el contenido del archivo 'sidebar.html'.              -->
            <!-- ========================================================= -->
        </div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4">
                        <i class="bi bi-box-seam"></i>Ajuste de Inventario
                    </h1>

                    <!-- PANEL DE FILTROS -->
                    <div class="row mb-3">
                        <div class="col-12">
                            <div class="card"
                                style="background:rgba(255,255,255,0.65);
                                        border:1px solid rgba(100,160,255,0.3);
                                        box-shadow:0 8px 32px rgba(30,80,180,0.12);
                                        border-radius:12px;
                                        backdrop-filter:blur(6px);">
                                <!-- HEADER -->
                                <div class="card-header py-2 px-3 d-flex justify-content-between align-items-center"
                                    style="background:rgba(30,80,180,0.9);
                                            color:white;
                                            border-radius:11px 11px 0 0;
                                            cursor:pointer;"
                                    data-bs-toggle="collapse"
                                    data-bs-target="#panelFiltrosInventario"
                                    aria-expanded="true">
                                    <span>
                                        <i class="bi bi-funnel-fill me-1"></i>
                                        <strong>Filtros</strong>
                                    </span>
                                    <i class="bi bi-chevron-down"></i>
                                </div>
                                <!-- BODY -->
                                <div class="collapse show" id="panelFiltrosInventario">
                                    <div class="card-body py-3">
                                        <div class="row g-3 align-items-end">
                                            <!-- BÚSQUEDA GENERAL -->
                                            <div class="col-md-3 col-sm-6">
                                                <label class="form-label fw-semibold small mb-1">Producto</label>
                                                <input type="text"
                                                    id="filtro_producto"
                                                    class="form-control form-control-sm"
                                                    placeholder="Nombre o código..."
                                                    oninput="cargarDatos()">
                                            </div>
                                            <!-- CATEGORÍA -->
                                            <div class="col-md-2 col-sm-6">
                                                <label for="filtro_categoria" class="form-label fw-semibold small mb-1">Categoría</label>
                                                <input id="filtro_categoria" list="datalist_categoria"
                                                    class="form-control form-control-sm"
                                                    oninput="cargarDatos()">
                                                <datalist id="datalist_categoria"></datalist>
                                            </div>
                                            <!-- MARCA -->
                                            <div class="col-md-2 col-sm-6">
                                                <label for="filtro_marca" class="form-label fw-semibold small mb-1">Marca</label>
                                                <input id="filtro_marca" list="datalist_marca"
                                                    class="form-control form-control-sm"
                                                    oninput="cargarDatos()">
                                                <datalist id="datalist_marca"></datalist>
                                            </div>
                                            <!-- STOCK BAJO -->
                                            <div class="col-md-2 col-sm-6">
                                                <label class="form-label fw-semibold small mb-1">Stock</label>
                                                <select id="filtro_stock"
                                                    class="form-select form-select-sm"
                                                    onchange="cargarDatos()">
                                                    <option value="">TODOS</option>
                                                    <option value="BAJO">BAJO STOCK</option>
                                                    <option value="OK">NORMAL</option>
                                                </select>
                                            </div>
                                            <!-- TIPO AJUSTE -->
                                            <div class="col-md-2 col-sm-6">
                                                <label class="form-label fw-semibold small mb-1">Ajuste</label>
                                                <select id="filtro_tipo_ajuste"
                                                    class="form-select form-select-sm"
                                                    onchange="cargarDatos()">
                                                    <option value="">TODOS</option>
                                                    <option value="ENTRADA">ENTRADA</option>
                                                    <option value="SALIDA">SALIDA</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TABLA INVENTARIO -->
                    <div class="row mb-2">
                        <div class="col-12">
                            <div class="card"
                                style="background:rgba(255,255,255,0.65);
                                        border:1px solid rgba(100,160,255,0.3);
                                        box-shadow:0 8px 32px rgba(30,80,180,0.12);
                                        border-radius:12px;
                                        backdrop-filter:blur(6px);">
                                <!-- HEADER TOGGLE -->
                                <div class="card-header py-2 px-3 d-flex justify-content-between align-items-center"
                                    style="background:rgba(30,80,180,0.9);
                                            color:white;
                                            border-radius:11px 11px 0 0;
                                            cursor:pointer;"
                                    data-bs-toggle="collapse"
                                    data-bs-target="#collapseInventario"
                                    aria-expanded="true"
                                    aria-controls="collapseInventario">
                                    <span>
                                        <i class="bi bi-table me-1"></i>
                                        <strong>Inventario de Productos</strong>
                                    </span>
                                    <i class="bi bi-chevron-down"></i>
                                </div>
                                <!-- BODY -->
                                <div class="collapse show" id="collapseInventario">
                                    <div class="card-body p-2">
                                        <table id="tabla_inventario" class="display compact" style="width:100%">
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TABLA HISTORIAL -->
                    <div class="row">
                        <div class="col-12">
                            <div class="card"
                                style="background:rgba(255,255,255,0.65);
                                        border:1px solid rgba(100,160,255,0.3);
                                        box-shadow:0 8px 32px rgba(30,80,180,0.12);
                                        border-radius:12px;
                                        backdrop-filter:blur(6px);">
                                <!-- HEADER TOGGLE -->
                                <div class="card-header py-2 px-3 d-flex justify-content-between align-items-center"
                                    style="background:rgba(30,80,180,0.9);
                                            color:white;
                                            border-radius:11px 11px 0 0;
                                            cursor:pointer;">
                                    <span>
                                        <i class="bi bi-table me-1"></i>
                                        <strong>Historial de Ajustes</strong>
                                    </span>
                                </div>
                                <!-- BODY -->
                                 <div class="card-body p-2">
                                    <table id="tabla_historial_ajustes" class="display compact" style="width:100%">
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
            <footer class="py-4 bg-light mt-auto" id="contenedor-footer">
                <!-- ========================================================= -->
                <!-- 3. CONTENEDOR DINÁMICO PARA EL PIE DE PAGINA (FOOTER)     -->
                <!-- Este div vacío será llenado por JavaScript usando fetch() -->
                <!-- con el contenido del archivo 'footer.html'.               -->
                <!-- ========================================================= -->
            </footer>
        </div>
    </div>

    <!-- MODAL AJUSTE -->
    <div class="modal fade" id="modalAjusteStock">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">
                        Ajuste de Stock
                    </h5>
                    <button class="btn-close btn-close-white"
                            data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="ajuste_producto_id">
                    <div class="mb-3">
                        <label class="form-label">Producto</label>
                        <input type="text"
                            id="ajuste_producto_nombre"
                            class="form-control"
                            readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Stock Actual</label>
                        <input type="number"
                            id="ajuste_stock_actual"
                            class="form-control"
                            readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tipo de Ajuste</label>
                        <select id="ajuste_tipo" class="form-select">
                            <option value="ENTRADA">ENTRADA</option>
                            <option value="SALIDA">SALIDA</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Cantidad</label>
                        <input type="number"
                            id="ajuste_cantidad"
                            min="1"
                            class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Motivo</label>
                        <textarea id="ajuste_motivo"
                                rows="3"
                                class="form-control"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Cancelar
                    </button>
                    <button class="btn btn-primary"
                            onclick="onClickGuardarAjuste()">
                        Guardar Ajuste
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="menu/scripts.js"></script>
    <script src="bt/bootstrap.bundle.min.js"></script>
    <script src="alert/alertify.min.js"></script>
    <!-- DATATABLES -->
    <script src="dt/jquery-3.7.1.js"></script>
    <script src="dt/datatables.min.js"></script>
    <script src="dt/jquery.dataTables.min.js"></script>
    <script src="dt/es-ES.js"></script>
    <!-- DATATABLES Buttons extension -->
    <script src="dt/dataTables.buttons.min.js"></script>
    <script src="dt/buttons.print.min.js"></script>
    <script src="dt/buttons.html5.min.js"></script>
    <!-- DATATABLES JSZip y pdfmake para exportar -->
    <script src="dt/jszip.min.js"></script>
    <script src="dt/pdfmake.min.js"></script>
    <script src="dt/vfs_fonts.js"></script>
    <!-- SCRIPTS -->
    <script src="js/bd.js"></script>
    <script src="js/alertas.js"></script>
    <script src="js/tablas.js"></script>
    <script src="js/inventario.js"></script>
</body>
</html>
